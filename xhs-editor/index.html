<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="小红书文案工坊 — 自由组合封面、标题、正文、话题、评论，一键复制发布。">
<meta name="keywords" content="小红书文案,文案编辑器,小红书排版,内容创作,文案模板">
<title>文案工坊 — EasyDoIt</title>
<style>
*,::before,::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f5f5f7;
  --surface:#fff;
  --surface2:#f2f2f4;
  --border:#e5e5ea;
  --text:#1d1d1f;
  --text2:#6e6e73;
  --text3:#aeaeb2;
  --accent:#007aff;
  --accent-soft:#e8f2ff;
  --accent-hover:#0062cc;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --radius:6px;
  --radius-sm:4px;
  --radius-lg:12px;
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;
    --surface:#2c2c2e;
    --surface2:#3a3a3c;
    --border:#48484a;
    --text:#f5f5f7;
    --text2:#98989d;
    --text3:#636366;
    --accent:#0a84ff;
    --accent-soft:#1c3a5e;
    --accent-hover:#4da4ff;
  }
}

body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.hdr{
  height:42px;padding:0 12px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.hl{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:-.01em}
.hl-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hr{display:flex;align-items:center;gap:2px}
.btn{
  padding:3px 8px;border:none;border-radius:4px;cursor:pointer;
  font-size:9px;font-weight:500;font-family:var(--font);
  background:var(--surface2);color:var(--text2);
  transition:background .12s;white-space:nowrap;letter-spacing:-.01em;
}
.btn:hover{background:var(--border)}
.btn-p{background:var(--accent);color:#fff;font-weight:600}
.btn-p:hover{background:var(--accent-hover)}
.btn-d{color:var(--accent)}
.btn-d:hover{background:var(--accent-soft)}
.chip{
  font-size:9px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:1px 6px;border-radius:4px;
}

.ct{display:flex;flex:1;overflow:hidden}

.lp{
  width:320px;min-width:240px;background:var(--surface);
  border-right:1px solid var(--border);display:flex;
  flex-direction:column;overflow:hidden;flex-shrink:0;
}

.tb-scroll{padding:3px 8px 2px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tb-scroll::-webkit-scrollbar{display:none}
.tb{
  display:flex;gap:1px;background:var(--surface2);
  border-radius:5px;padding:1px;min-width:fit-content;
}
.tb-i{
  flex:0 0 auto;padding:3px 8px;text-align:center;
  font-size:9px;font-weight:500;color:var(--text2);
  cursor:pointer;border-radius:4px;transition:all .12s;
  white-space:nowrap;position:relative;user-select:none;
}
.tb-i:hover{color:var(--text)}
.tb-i.act{color:var(--text);font-weight:600;background:var(--surface);box-shadow:0 1px 1px rgba(0,0,0,.04)}
.tb-b{position:absolute;top:-3px;right:-4px;font-size:7px;font-weight:700;color:var(--text2)}

.panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.panel.hidden{display:none}

.srch{padding:2px 8px 3px;flex-shrink:0}
.si{
  width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:4px;
  background:var(--surface2);color:var(--text);font-size:9px;font-family:var(--font);
  outline:none;transition:border-color .12s;
}
.si:focus{border-color:var(--accent);background:var(--surface)}
.si::placeholder{color:var(--text3)}

.clist{flex:1;overflow-y:auto;padding:0 6px 2px}
.card{
  display:flex;align-items:flex-start;gap:6px;
  padding:4px 6px;border-radius:4px;cursor:pointer;
  border-left:2px solid transparent;transition:all .12s;
}
.card:hover{background:var(--surface2)}
.card.sel{border-left-color:var(--accent)}
.card .cb{
  appearance:none;-webkit-appearance:none;
  width:12px;height:12px;border-radius:50%;
  border:1.5px solid var(--border);flex-shrink:0;cursor:pointer;
  margin-top:2px;transition:all .12s;background:var(--surface);
}
.card .cb:checked{background:var(--accent);border-color:var(--accent)}
.card .cb:checked::after{
  content:'';position:absolute;left:3px;top:1px;
  width:3px;height:6px;border:solid #fff;border-width:0 1px 1px 0;
  transform:rotate(45deg);
}
.card .cbody{flex:1;min-width:0}
.card .ctx{font-size:10px;line-height:1.4;word-break:break-word;color:var(--text)}
.card .cmeta{display:flex;align-items:center;gap:4px;margin-top:1px}
.card .ctag{font-size:7px;font-weight:500;padding:0 4px;border-radius:2px;color:var(--text2);background:var(--border)}
.card .clen{font-size:7px;color:var(--text3)}
.card .cact{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .1s}
.card:hover .cact{opacity:1}
.card .cact button{
  background:none;border:none;color:var(--text3);cursor:pointer;
  padding:1px 3px;font-size:9px;line-height:1;border-radius:3px;
}
.card .cact button:hover{color:var(--text);background:var(--border)}

.emp{padding:24px 0;text-align:center;color:var(--text3);font-size:10px;line-height:1.5}

.ft{padding:2px 8px 6px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.fr{display:flex;gap:2px}
.fr input{
  flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;
  background:var(--surface2);color:var(--text);font-size:9px;font-family:var(--font);
  outline:none;transition:border-color .12s;
}
.fr input:focus{border-color:var(--accent);background:var(--surface)}
.fr input::placeholder{color:var(--text3)}
.fb{font-size:8px;color:var(--text3);display:flex;justify-content:space-between}

/* Right: Preview */
.rh{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:12px;gap:10px;background:var(--bg);
}

.pw{flex-shrink:0}
.phone{
  width:224px;height:454px;border-radius:32px;
  background:var(--surface2);padding:6px;position:relative;
  box-shadow:0 0 0 2px var(--border),0 12px 40px rgba(0,0,0,.06);
}
.pf{
  width:100%;height:100%;background:#0a0a0c;
  border-radius:27px;overflow:hidden;position:relative;
}
.pd{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:64px;height:18px;background:#0a0a0c;border-radius:10px;z-index:10;
}
.ps{
  width:100%;height:100%;background:#fff;border-radius:27px;
  overflow:hidden;display:flex;flex-direction:column;
}

.xsb{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px 3px;font-size:8px;font-weight:600;color:#1d1d1f;flex-shrink:0;
}
.xns{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.xns::-webkit-scrollbar{width:0}

.xu{display:flex;align-items:center;gap:5px;padding:2px 9px;flex-shrink:0}
.xa{width:20px;height:20px;border-radius:50%;background:#ff2442;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:7px;font-weight:700}
.xn{font-size:8px;font-weight:600;color:#1d1d1f}
.xt{font-size:6px;color:#aeaeb2;margin-left:3px}
.xf{font-size:7px;font-weight:600;color:#ff2442;border:1px solid #ffe0e5;border-radius:8px;padding:1px 6px;background:#fff;cursor:default;flex-shrink:0;margin-left:auto}

.xc{
  width:100%;aspect-ratio:1;flex-shrink:0;
  background:linear-gradient(145deg,#1a1a2e,#16213e,#0f3460);
  display:flex;align-items:center;justify-content:center;
  padding:16px;position:relative;overflow:hidden;
}
.xc-t{position:relative;font-size:12px;font-weight:800;color:#fff;text-align:center;line-height:1.3;word-break:break-word}
.xc-t.ph{font-size:8px;font-weight:400;color:rgba(255,255,255,.1)}
.xc-pg{position:absolute;bottom:4px;right:4px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;font-size:6px;padding:0 4px;border-radius:4px}

.xb{padding:4px 10px 1px;flex-shrink:0}
.xb-t{font-size:10px;font-weight:700;color:#1d1d1f;line-height:1.3;word-break:break-word}
.xb-t.ph{color:#e8e8ed;font-weight:400;font-size:7px}
.xb-c{font-size:7px;color:#3a3a3c;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.xb-c.ph{color:#ededed}
.xb-h{color:#4169b8;text-decoration:none;font-size:7px;margin-right:1px}
.xb-h.ev{color:#d4641a;font-weight:600}
.xb-loc{padding:0 10px 2px;font-size:6px;color:#aeaeb2;flex-shrink:0}
.xb-loc.ph{color:#ededed}

.xbar{
  display:flex;justify-content:space-around;padding:1px 10px;flex-shrink:0;
  border-top:1px solid rgba(0,0,0,.03);margin:0 10px;
}
.xbar-i{font-size:6px;color:#aeaeb2;background:none;border:none;cursor:default;font-family:var(--font);flex:1;padding:1px 0;text-align:center}
.xbar-i .xi{font-size:10px}

.xcm{padding:2px 10px 4px;flex-shrink:0}
.xcm-i{font-size:6px;color:#636366;line-height:1.4}
.xcm-u{font-weight:600;color:#48484a;margin-right:1px}
.xcm.ph{color:#ededed;font-size:6px}
.xcm-hint{font-size:6px;color:#ededed;text-align:center;padding:1px 0}

.bar{
  display:flex;gap:4px;flex-shrink:0;
  background:var(--surface);border-radius:8px;
  padding:3px;border:1px solid var(--border);
}
.bbtn{
  display:flex;align-items:center;gap:3px;
  padding:4px 10px;border:none;border-radius:6px;
  cursor:pointer;font-family:var(--font);font-size:9px;font-weight:600;
  color:var(--text2);background:var(--surface2);
  transition:all .12s;white-space:nowrap;
}
.bbtn:hover{background:var(--border);color:var(--text)}
.bbtn .bi{font-size:11px}

.mo{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(2px);
}
.mo.hd{display:none}
.mw{
  background:var(--surface);border-radius:8px;width:360px;max-width:92vw;
  padding:20px;box-shadow:0 16px 48px rgba(0,0,0,.08);
}
.mw h3{font-size:13px;font-weight:700;margin-bottom:2px}
.mw .hint{font-size:9px;color:var(--text2);margin-bottom:8px}
.mw textarea{
  width:100%;height:140px;padding:8px;line-height:1.5;
  border:1px solid var(--border);border-radius:4px;
  background:var(--surface2);color:var(--text);
  font-size:10px;font-family:var(--font);
  resize:vertical;outline:none;
}
.mw textarea:focus{border-color:var(--accent);background:var(--surface)}
.mw textarea::placeholder{color:var(--text3)}
.mwa{display:flex;gap:4px;justify-content:flex-end;margin-top:10px}

.ts{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,32,.9);backdrop-filter:blur(8px);
  color:#fff;border-radius:6px;padding:3px 12px;
  font-size:9px;font-weight:500;z-index:300;
  pointer-events:none;opacity:0;transition:opacity .2s;
}
.ts.sh{opacity:1}

/* Responsive */
@media(max-width:768px){
  .ct{flex-direction:column}
  .lp{width:100%;min-width:0;flex:1 1 55%}
  .rh{flex:1 1 45%;padding:8px;gap:6px}
  .phone{width:180px;height:364px;border-radius:24px;padding:4px}
  .pf{border-radius:20px}.ps{border-radius:20px}
  .pd{top:4px;width:44px;height:12px;border-radius:8px}
  .bar{gap:2px;padding:2px;border-radius:6px}
  .bbtn{padding:3px 6px;font-size:8px;gap:2px}
  .bbtn .bi{font-size:9px}
  .xc-t{font-size:10px}.xb-t{font-size:8px}.xb-c{font-size:6px}
  .xc{padding:12px}
}
@media(max-width:420px){
  .hdr{padding:0 8px;height:38px}
  .hl{font-size:11px}.hl-dot{width:5px;height:5px}
  .btn{padding:2px 6px;font-size:8px}
  .chip{font-size:8px;padding:0 4px}
  .lp{flex:1 1 52%}
  .rh{flex:1 1 48%;padding:4px;gap:3px}
  .phone{width:148px;height:298px;border-radius:20px;padding:3px}
  .pf{border-radius:16px}.ps{border-radius:16px}
  .pd{top:3px;width:32px;height:9px;border-radius:6px}
  .bar{gap:1px;padding:1px}
  .bbtn{padding:2px 5px;font-size:7px;gap:1px}
  .bbtn .bi{font-size:7px}
  .xc-t{font-size:9px}.xb-t{font-size:7px}.xb-c{font-size:6px}
  .xc{padding:10px}.xsb{padding:8px 10px 2px;font-size:7px}
  .tb-i{font-size:8px;padding:2px 6px}
  .card{padding:3px 4px}.card .ctx{font-size:9px}
  .si,.fr input{font-size:8px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hl"><div class="hl-dot"></div>文案工坊</div>
  <div class="hr">
    <span class="chip">已选 <b id="gC">0</b></span>
    <button class="btn" onclick="randAll()">随机</button>
    <button class="btn" onclick="exp()">导出</button>
    <button class="btn" onclick="$('imF').click()">导入</button>
    <input type="file" id="imF" accept=".json" onchange="imp(this)" style="display:none">
    <button class="btn btn-d" onclick="clr()">清空</button>
  </div>
</header>

<div class="ct">
  <div class="lp" id="lp">
    <div class="tb-scroll"><div class="tb" id="tb"></div></div>
  </div>

  <div class="rh">
    <div class="pw">
      <div class="phone">
        <div class="pf"><div class="pd"></div>
          <div class="ps">
            <div class="xsb"><span>9:41</span><span>&#x2022;&#x2022;&#x2022;</span></div>
            <div class="xns">
              <div class="xu"><div class="xa">我</div><div class="xn">小红书博主</div><span class="xt">刚刚</span><div class="xf">关注</div></div>
              <div class="xc"><div class="xc-t ph" id="pvCv">点击随机挑选文案</div><div class="xc-pg">1/1</div></div>
              <div class="xb"><div class="xb-t ph" id="pvTt">标题预览区</div><div class="xb-c ph" id="pvCt">正文内容将在这里显示</div></div>
              <div class="xb-loc ph" id="pvLoc">发布位置</div>
              <div class="xbar"><div class="xbar-i"><span class="xi">&#x2665;</span>赞</div><div class="xbar-i"><span class="xi">&#x1F4AC;</span>评</div><div class="xbar-i"><span class="xi">&#x2606;</span>藏</div><div class="xbar-i"><span class="xi">&#x2197;</span>分享</div></div>
              <div class="xcm ph" id="pvCm">评论区文案预览</div>
              <div class="xcm-hint">来聊聊吧</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bar">
      <button class="bbtn" onclick="cpy('cover')"><span class="bi">🖼</span>封面</button>
      <button class="bbtn" onclick="cpy('title')"><span class="bi">T</span>标题</button>
      <button class="bbtn" onclick="cpy('body')"><span class="bi">📝</span>正文</button>
      <button class="bbtn" onclick="cpy('cmts')"><span class="bi">💬</span>评论</button>
      <button class="bbtn" onclick="cpyAll()"><span class="bi">📋</span>全部</button>
    </div>
  </div>
</div>

<div class="mo hd" id="bm">
  <div class="mw">
    <h3 id="bmT">批量导入</h3><div class="hint">每行一条，空行跳过</div>
    <textarea id="bmTx" placeholder="粘贴文案&#x2026;"></textarea>
    <div class="mwa"><button class="btn" onclick="cb()">取消</button><button class="btn btn-p" onclick="dbt()">确认</button></div>
  </div>
</div>

<div class="ts" id="ts"></div>

<script>
const M=['封面文案','标题文案','内容文案','普通话题','活动话题','评论区文案'];
const SK='xhs_v7';let d={items:[[],[],[],[],[],[]],selected:[[],[],[],[],[],[]]};
let f=['','','','','',''];let bi=-1,curTab=0;

function $(s){return document.getElementById(s)}
function ld(){
  try{
    const r=localStorage.getItem(SK);
    if(r){const x=JSON.parse(r);if(x.items)d.items=x.items.slice();if(x.selected)d.selected=x.selected.slice()}
  }catch(e){}
  for(let i=0;i<6;i++){if(!Array.isArray(d.items[i]))d.items[i]=[];if(!Array.isArray(d.selected[i]))d.selected[i]=[]}
}
function sv(){localStorage.setItem(SK,JSON.stringify(d))}
function es(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function cp(t){
  navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;
    ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已复制')
  })
}
function toast(m){const e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('sh'),1000)}

function rn(i){
  const t=f[i],arr=d.items[i],sl=d.selected[i];
  const ct=$('l-'+i),st=$('s-'+i),ch=$('c-'+i);
  if(!ct||!st||!ch)return;
  const flt=t?arr.map((v,idx)=>({v,idx})).filter(o=>o.v.toLowerCase().includes(t)):arr.map((v,idx)=>({v,idx}));
  if(!arr.length){ct.innerHTML='<div class="emp">暂无文案</div>'}
  else if(!flt.length){ct.innerHTML='<div class="emp">无匹配结果</div>'}
  else{
    ct.innerHTML=flt.map(({v,idx})=>{
      const s=sl.includes(idx);let tg='';if(i===3)tg='<span class="ctag">普通</span>';if(i===4)tg='<span class="ctag">活动</span>';
      return `<div class="card ${s?'sel':''}" onclick="tg(${i},${idx})">
        <input type="checkbox" class="cb" ${s?'checked':''} onclick="event.stopPropagation();tg(${i},${idx})">
        <div class="cbody"><div class="ctx">${es(v)}</div><div class="cmeta">${tg}<span class="clen">${v.length}字</span></div></div>
        <div class="cact"><button onclick="cpI(${i},${idx},event)">&#x1F4CB;</button></div>
      </div>`
    }).join('')
  }
  const tl=arr.length,sl2=sl.length,sc=sl.reduce((s,idx)=>s+(arr[idx]||'').length,0);
  st.textContent=tl?`${tl}条&#xA0;${sl2?'&#xB7;&#xA0;已选'+sl2:''}`:'';ch.textContent=sl2?`${sc}字`:'';
  const bd=$('bd-'+i);if(bd)bd.textContent=sl2||''
}

function ua(){up();uh()}
function uh(){const t=d.selected.reduce((s,a)=>s+a.length,0);$('gC').textContent=t}
function up(){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);
  const cv=g(0),tl=g(1),ct=g(2),nt=g(3),et=g(4),cm=g(5);
  const eC=$('pvCv');if(cv.length){eC.textContent=cv.join('\n');eC.classList.remove('ph')}else{eC.textContent='封面文案预览';eC.classList.add('ph')}
  const eT=$('pvTt');if(tl.length){eT.textContent=tl.join(' ');eT.classList.remove('ph')}else{eT.textContent='标题预览区';eT.classList.add('ph')}
  const eCt=$('pvCt');
  if(ct.length||nt.length||et.length){
    let h='';if(ct.length)h+=es(ct.join('\n\n'));
    const al=[...nt.map(t=>({t,ty:'n'})),...et.map(t=>({t,ty:'e'}))];
    if(al.length)h+=(ct.length?'\n\n':'')+al.map(o=>`<span class="xb-h${o.ty==='e'?' ev':''}">#${es(o.t)}</span>`).join(' ');
    eCt.innerHTML=h;eCt.classList.remove('ph')
  }else{eCt.textContent='正文内容将在这里显示';eCt.classList.add('ph')}
  const eL=$('pvLoc');eL.textContent=(cv.length||tl.length||ct.length)?'&#x1F4CD; 上海':'发布位置';eL.classList.toggle('ph',!(cv.length||tl.length||ct.length));
  const eCm=$('pvCm');
  if(cm.length){eCm.innerHTML=cm.map((c,k)=>`<div class="xcm-i"><span class="xcm-u">用户${k+1}</span>${es(c)}</div>`).join('');eCm.classList.remove('ph')}
  else{eCm.textContent='评论区文案预览';eCm.classList.add('ph')}
}

function add(i){const v=$('i-'+i).value.trim();if(!v)return;d.items[i].push(v);$('i-'+i).value='';sv();rn(i);ua()}
function tg(i,idx){const p=d.selected[i].indexOf(idx);if(p===-1)d.selected[i].push(idx);else d.selected[i].splice(p,1);sv();rn(i);ua()}
function rm(i,idx,e){e.stopPropagation();e.preventDefault();d.items[i].splice(idx,1);d.selected[i]=d.selected[i].filter(s=>s!==idx).map(s=>s>idx?s-1:s);sv();rn(i);ua()}
function cpI(i,idx,e){e.stopPropagation();e.preventDefault();cp(d.items[i][idx])}
function fl(i,v){f[i]=v.toLowerCase();rn(i)}

function randAll(){
  if(!d.items.some(a=>a.length)){toast('请先导入或添加文案');return}
  const pk=(i,cnt)=>{if(!d.items[i].length)return[];const n=Math.min(cnt,d.items[i].length);const po=shuf([...Array(d.items[i].length).keys()]);return po.slice(0,n).sort((a,b)=>a-b)};
  d.selected[0]=pk(0,1);d.selected[1]=pk(1,1);d.selected[2]=pk(2,1);d.selected[3]=pk(3,9);d.selected[4]=pk(4,1);d.selected[5]=pk(5,1);
  sv();for(let i=0;i<6;i++)rn(i);ua();toast('已随机挑选一套文案')
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function cpyAll(){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);
  const p=[];const cv=g(0).join('\n');if(cv)p.push('【封面】\n'+cv);
  const tl=g(1).join(' ');if(tl)p.push('【标题】\n'+tl);
  const ct=g(2).join('\n\n'),nt=g(3).map(x=>'#'+x).join(' '),et=g(4).map(x=>'#'+x).join(' ');
  const tags=[nt,et].filter(Boolean).join(' ');
  if(ct||tags)p.push('【正文】\n'+(ct||'')+(ct&&tags?'\n\n':'')+(tags||''));
  const cm=g(5).join('\n');if(cm)p.push('【评论区】\n'+cm);
  if(!p.length){toast('请先选择文案');return}cp(p.join('\n\n'))
}
function cpy(m){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);let t='';
  if(m==='cover')t=g(0).join('\n');
  else if(m==='title')t=g(1).join(' ');
  else if(m==='body'){const ct=g(2).join('\n\n'),nt=g(3).map(x=>'#'+x).join(' '),et=g(4).map(x=>'#'+x).join(' ');t=(ct||'')+(ct&&(nt||et)?'\n\n':'')+[nt,et].filter(Boolean).join(' ')}
  else if(m==='cmts')t=g(5).join('\n');
  if(!t){toast('该模块未选择文案');return}cp(t)
}

function bat(i){bi=i;$('bmT').textContent='批量导入 - '+M[i];$('bmTx').value='';$('bm').classList.remove('hd');setTimeout(()=>$('bmTx').focus(),50)}
function cb(){$('bm').classList.add('hd');bi=-1}
function dbt(){const ls=$('bmTx').value.split('\n').map(l=>l.trim()).filter(l=>l);if(!ls.length||bi<0){cb();return}d.items[bi]=d.items[bi].concat(ls);sv();rn(bi);ua();cb()}

function exp(){const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xhs-bank-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.items){for(let i=0;i<6;i++)if(Array.isArray(x.items[i]))d.items[i]=d.items[i].concat(x.items[i])}else if(x.cover||x.title){d.items[0]=d.items[0].concat(x.cover||[]);d.items[1]=d.items[1].concat(x.title||[]);d.items[2]=d.items[2].concat(x.content||[]);d.items[3]=d.items[3].concat(x.topics||[]);d.items[4]=d.items[4].concat(x.activities||[]);d.items[5]=d.items[5].concat(x.comments||[])}if(x.selected)for(let i=0;i<6;i++)if(Array.isArray(x.selected[i]))d.selected[i]=x.selected[i];sv();for(let i=0;i<6;i++)rn(i);ua();toast('导入完成')}catch(e){toast('文件格式错误')}};r.readAsText(f);inp.value=''}
function clr(){if(!confirm('确定清空全部文案？'))return;d={items:[[],[],[],[],[],[]],selected:[[],[],[],[],[],[]]};sv();for(let i=0;i<6;i++)rn(i);ua()}

function sw(i){
  curTab=i;
  document.querySelectorAll('.tb-i').forEach((t,idx)=>t.classList.toggle('act',idx===i));
  document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('hidden',idx!==i));
}

function initPanels(){
  const lp=$('lp');
  const html=M.map((n,i)=>`
    <div class="panel ${i===0?'':'hidden'}">
      <div class="srch"><input class="si" id="si-${i}" placeholder="搜索..."></div>
      <div class="clist" id="l-${i}"></div>
      <div class="ft">
        <div class="fr">
          <input id="i-${i}" placeholder="添加..." onkeydown="if(event.key==='Enter')add(${i})">
          <button class="btn btn-p" onclick="add(${i})">添加</button>
          <button class="btn" onclick="bat(${i})">批量</button>
        </div>
        <div class="fb"><span id="s-${i}"></span><span id="c-${i}"></span></div>
      </div>
    </div>`).join('');
  lp.insertAdjacentHTML('beforeend',html);
}

ld();
$('tb').innerHTML=M.map((n,i)=>`<div class="tb-i ${i===0?'act':''}" onclick="sw(${i})">${n}<span class="tb-b" id="bd-${i}">0</span></div>`).join('');
initPanels();
rn(0);ua();
</script>
</body>
</html>
