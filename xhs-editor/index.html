<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="小红书文案工坊 — 自由组合封面、标题、正文、话题、评论，一键复制发布。">
<meta name="keywords" content="小红书文案,文案编辑器,小红书排版,内容创作,文案模板">
<title>文案工坊 — EasyDoIt</title>
<style>
*,::before,::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:oklch(0.975 0.001 90);
  --surface:oklch(1 0 0);
  --surface2:oklch(0.968 0.002 90);
  --border:oklch(0.90 0.003 90);
  --text:oklch(0.18 0.002 270);
  --text2:oklch(0.44 0.004 270);
  --text3:oklch(0.66 0.004 270);
  --accent:oklch(0.52 0.08 260);
  --accent-soft:oklch(0.94 0.02 260);
  --accent-hover:oklch(0.45 0.08 260);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --radius:10px;
  --radius-sm:7px;
  --radius-lg:16px;
  --shadow:0 1px 3px oklch(0 0 0 / .04);
  --ease:.25s cubic-bezier(.25,0,0,1);
  --ease-fast:.15s cubic-bezier(.25,0,0,1);
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:oklch(0.15 0.002 270);
    --surface:oklch(0.18 0.002 270);
    --surface2:oklch(0.22 0.002 270);
    --border:oklch(0.28 0.003 270);
    --text:oklch(0.90 0.002 270);
    --text2:oklch(0.62 0.003 270);
    --text3:oklch(0.44 0.003 270);
    --accent:oklch(0.72 0.10 230);
    --accent-soft:oklch(0.25 0.03 250);
    --accent-hover:oklch(0.78 0.10 230);
    --shadow:0 1px 3px oklch(0 0 0 / .2);
  }
}

body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);color:var(--accent)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:oklch(0 0 0 / .1);border-radius:8px}

/* ═══ Header ═══ */
.hdr{
  height:44px;padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  z-index:100;
}
.hl{display:flex;align-items:center;gap:6px}
.hl-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hl-t{font-size:13px;font-weight:600;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:3px}
.btn{
  padding:4px 10px;border:none;border-radius:12px;cursor:pointer;
  font-size:10px;font-weight:500;font-family:var(--font);
  background:var(--surface2);color:var(--text2);
  transition:all var(--ease-fast);white-space:nowrap;
  letter-spacing:-.01em;outline:none;
}
.btn:focus-visible{box-shadow:0 0 0 2px var(--accent-soft)}
.btn:hover{background:oklch(0.93 0.003 270);color:var(--text)}
.btn-p{background:var(--accent);color:#fff;font-weight:600}
.btn-p:hover{background:var(--accent-hover);color:#fff}
.btn-d{color:var(--accent);background:var(--accent-soft)}
.btn-d:hover{background:oklch(0.88 0.03 260)}
.btn-sm{padding:3px 8px;font-size:9px}
.chip{
  font-size:9px;font-weight:600;color:var(--accent);
  padding:2px 8px;border-radius:10px;
  background:var(--accent-soft);letter-spacing:-.01em;
}

/* ═══ Main ═══ */
.ct{display:flex;flex:1;overflow:hidden}

/* ═══ Left Panel ═══ */
.lp{
  width:360px;min-width:280px;background:var(--surface);
  border-right:1px solid var(--border);display:flex;
  flex-direction:column;overflow:hidden;flex-shrink:0;
}

.tb-scroll{padding:4px 10px 3px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tb-scroll::-webkit-scrollbar{display:none}
.tb{
  display:flex;gap:2px;background:var(--surface2);
  border-radius:8px;padding:2px;min-width:fit-content;
}
.tb-i{
  flex:0 0 auto;padding:4px 9px;text-align:center;
  font-size:10px;font-weight:500;color:var(--text2);
  cursor:pointer;border-radius:6px;transition:all var(--ease-fast);
  white-space:nowrap;position:relative;user-select:none;
  letter-spacing:-.01em;
}
.tb-i:hover{color:var(--text)}
.tb-i.act{
  color:var(--text);font-weight:600;background:var(--surface);
  box-shadow:0 1px 2px oklch(0 0 0 / .03);
}
.tb-b{
  position:absolute;top:-5px;right:-7px;
  font-size:7px;font-weight:700;color:var(--text2);
  min-width:12px;text-align:center;
}

.panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.panel.hidden{display:none}

.srch{padding:2px 10px 5px;flex-shrink:0}
.si{
  width:100%;padding:6px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg);
  color:var(--text);font-size:10px;font-family:var(--font);
  transition:border-color var(--ease-fast);outline:none;
}
.si:focus{border-color:var(--accent)}
.si::placeholder{color:var(--text3)}

.clist{flex:1;overflow-y:auto;padding:0 8px 4px}
.card{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 10px;margin-bottom:1px;border-radius:var(--radius-sm);
  cursor:pointer;border-left:2px solid transparent;
  transition:all var(--ease-fast);position:relative;
}
.card:hover{background:var(--surface2)}
.card.sel{
  background:var(--accent-soft);
  border-left-color:var(--accent);
}
.card .cb{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--border);flex-shrink:0;cursor:pointer;
  margin-top:2px;transition:all var(--ease-fast);background:var(--surface);
}
.card .cb:checked{background:var(--accent);border-color:var(--accent)}
.card .cb:checked::after{
  content:'';position:absolute;left:3px;top:1px;
  width:4px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg);
}
.card .cbody{flex:1;min-width:0}
.card .ctx{font-size:11px;line-height:1.45;word-break:break-word;color:var(--text)}
.card .cmeta{display:flex;align-items:center;gap:4px;margin-top:2px}
.card .ctag{font-size:8px;font-weight:500;padding:1px 5px;border-radius:3px;color:var(--text2);background:var(--border)}
.card .clen{font-size:8px;color:var(--text3)}
.card .cact{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity var(--ease-fast)}
.card:hover .cact{opacity:1}
.card .cact button{
  background:none;border:none;color:var(--text3);cursor:pointer;
  padding:2px 4px;border-radius:4px;font-size:10px;line-height:1;
  transition:all var(--ease-fast);
}
.card .cact button:hover{color:var(--text)}
.emp{padding:32px 0;text-align:center;color:var(--text3);font-size:10px;line-height:1.7}

.ft{padding:2px 10px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.fr{display:flex;gap:3px}
.fr input{
  flex:1;padding:6px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg);
  color:var(--text);font-size:10px;font-family:var(--font);
  transition:border-color var(--ease-fast);outline:none;
}
.fr input:focus{border-color:var(--accent)}
.fr input::placeholder{color:var(--text3)}
.fb{font-size:8px;color:var(--text3);display:flex;justify-content:space-between;padding:0 1px}

/* ═══ Right: Preview ═══ */
.rh{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:16px;gap:16px;
  background:var(--bg);
}

.pw{position:relative;z-index:2;flex-shrink:0}
.phone{
  width:240px;height:488px;border-radius:34px;
  background:oklch(0.18 0.002 270);
  padding:7px;position:relative;
  box-shadow:
    0 0 0 2px oklch(0.28 0.003 270),
    0 20px 50px oklch(0 0 0 / .08);
  transition:transform .4s cubic-bezier(.25,0,0,1);
}
.pf{
  width:100%;height:100%;background:oklch(0.12 0.001 270);
  border-radius:28px;overflow:hidden;position:relative;
}
.pd{
  position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:72px;height:20px;background:oklch(0.12 0.001 270);
  border-radius:11px;z-index:10;
}
.ps{
  width:100%;height:100%;background:#fff;border-radius:28px;
  overflow:hidden;display:flex;flex-direction:column;
}

.xsb{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px 4px;font-size:9px;font-weight:600;
  color:#1d1d1f;flex-shrink:0;
}
.xns{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.xns::-webkit-scrollbar{width:0}

.xu{display:flex;align-items:center;gap:6px;padding:3px 10px 2px;flex-shrink:0}
.xa{
  width:22px;height:22px;border-radius:50%;
  background:oklch(0.55 0.18 10);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:8px;font-weight:700;
}
.xi{flex:1;min-width:0;line-height:1.2}
.xn{font-size:9px;font-weight:600;color:#1d1d1f}
.xt{font-size:7px;color:oklch(0.66 0.004 270);display:block;font-weight:400}
.xf{
  font-size:7px;font-weight:600;color:oklch(0.55 0.18 10);
  border:1px solid oklch(0.90 0.06 10);border-radius:10px;
  padding:1px 7px;background:#fff;cursor:default;flex-shrink:0;
}

.xc{
  width:100%;aspect-ratio:1;flex-shrink:0;
  background:linear-gradient(145deg,#1a1a2e,#16213e,#0f3460);
  display:flex;align-items:center;justify-content:center;
  padding:18px;position:relative;overflow:hidden;
}
.xc-t{
  position:relative;font-size:14px;font-weight:800;color:#fff;
  text-align:center;line-height:1.3;word-break:break-word;
  letter-spacing:-.01em;
}
.xc-t.ph{font-size:8px;font-weight:400;color:oklch(1 0 0 / .12)}
.xc-pg{position:absolute;bottom:5px;right:5px;background:oklch(1 0 0 / .1);backdrop-filter:blur(8px);color:#fff;font-size:6px;padding:1px 4px;border-radius:5px}

.xb{padding:5px 12px 2px;flex-shrink:0}
.xb-t{font-size:11px;font-weight:700;color:#1d1d1f;line-height:1.3;margin-bottom:1px;word-break:break-word}
.xb-t.ph{color:#e8e8ed;font-weight:400;font-size:7px}
.xb-c{font-size:8px;color:#3a3a3c;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.xb-c.ph{color:#ededed}
.xb-h{color:#4169b8;text-decoration:none;font-size:8px;margin-right:1px;display:inline}
.xb-h.ev{color:#d4641a;font-weight:600}
.xb-loc{padding:1px 12px 2px;font-size:7px;color:oklch(0.66 0.004 270);flex-shrink:0}

.xbar{
  display:flex;justify-content:space-around;padding:2px 10px 1px;
  flex-shrink:0;border-top:1px solid oklch(0 0 0 / .03);margin:0 12px;
}
.xbar-i{
  display:flex;flex-direction:column;align-items:center;gap:0px;
  font-size:6px;color:oklch(0.66 0.004 270);
  background:none;border:none;cursor:default;
  font-family:var(--font);flex:1;padding:1px 0;
}
.xbar-i .xi{font-size:11px;line-height:1}

.xcm{padding:2px 12px 5px;flex-shrink:0}
.xcm-i{font-size:7px;color:#636366;line-height:1.5;margin-bottom:0px}
.xcm-u{font-weight:600;color:#48484a;margin-right:1px}
.xcm.ph{color:#ededed;font-size:6px}
.xcm-hint{font-size:6px;color:#ededed;text-align:center;padding:1px 0}

/* ═══ Bottom Bar ═══ */
.bar{
  display:flex;gap:6px;z-index:2;flex-shrink:0;
  background:var(--surface);border-radius:var(--radius-lg);
  padding:5px;border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.bbtn{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border:none;border-radius:var(--radius);
  cursor:pointer;font-family:var(--font);font-size:10px;font-weight:600;
  transition:all var(--ease-fast);white-space:nowrap;
  letter-spacing:-.01em;color:var(--text2);
  background:var(--surface2);outline:none;
}
.bbtn:focus-visible{box-shadow:0 0 0 2px var(--accent-soft)}
.bbtn:hover{background:var(--border);color:var(--text)}
.bbtn .bi{
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;background:var(--bg);
}

/* ═══ Modal ═══ */
.mo{
  position:fixed;inset:0;z-index:200;
  background:oklch(0 0 0 / .12);display:flex;
  align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.mo.hd{display:none}
.mw{
  background:var(--surface);border-radius:var(--radius-lg);
  width:380px;max-width:92vw;padding:24px;
  box-shadow:0 24px 60px oklch(0 0 0 / .1);
}
.mw h3{font-size:14px;font-weight:700;margin-bottom:2px}
.mw .hint{font-size:10px;color:var(--text2);margin-bottom:10px}
.mw textarea{
  width:100%;height:160px;padding:10px;line-height:1.6;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text);
  font-size:11px;font-family:var(--font);
  resize:vertical;outline:none;transition:border-color var(--ease-fast);
}
.mw textarea:focus{border-color:var(--accent)}
.mw textarea::placeholder{color:var(--text3)}
.mwa{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}

/* ═══ Toast ═══ */
.ts{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  background:oklch(0.18 0.002 270 / .92);backdrop-filter:blur(12px);
  color:#fff;border-radius:10px;padding:5px 14px;
  font-size:10px;font-weight:500;z-index:300;
  pointer-events:none;opacity:0;transition:opacity .25s ease;
}
.ts.sh{opacity:1}

/* ═══ Responsive ═══ */
@media(max-width:880px){
  .ct{flex-direction:column}
  .lp{width:100%;min-width:0;flex:1 1 55%;max-height:55%}
  .rh{flex:1 1 45%;padding:8px;gap:6px}
  .phone{width:196px;height:397px;border-radius:26px;padding:5px}
  .pf{border-radius:22px}.ps{border-radius:22px}
  .pd{top:5px;width:52px;height:14px;border-radius:9px}
  .bar{gap:2px;padding:3px;border-radius:13px}
  .bbtn{padding:5px 8px;font-size:9px;gap:3px}
  .bbtn .bi{width:18px;height:18px;font-size:10px;border-radius:5px}
  .xc-t{font-size:11px}.xb-t{font-size:9px}.xb-c{font-size:7px}
  .xc{padding:14px}
}
@media(max-width:480px){
  .hdr{padding:0 10px;height:40px}
  .hl-t{font-size:11px}.hl-dot{width:6px;height:6px}
  .btn{padding:3px 7px;font-size:8px;border-radius:10px}
  .chip{font-size:8px;padding:1px 6px}
  .ct{flex-direction:column}
  .lp{flex:1 1 52%;max-height:52%;width:100%}
  .rh{flex:1 1 48%;padding:6px;gap:4px}
  .phone{width:148px;height:300px;border-radius:20px;padding:3px}
  .pf{border-radius:16px}.ps{border-radius:16px}
  .pd{top:3px;width:36px;height:10px;border-radius:7px}
  .bar{gap:2px;padding:2px;border-radius:10px}
  .bbtn{padding:4px 6px;font-size:8px;gap:2px}
  .bbtn .bi{width:16px;height:16px;font-size:9px;border-radius:4px}
  .xc-t{font-size:9px}.xb-t{font-size:8px}.xb-c{font-size:7px}
  .xc{padding:10px}
  .tb-i{padding:3px 6px;font-size:8px}
  .card{padding:6px 8px}
  .card .ctx{font-size:10px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hl"><div class="hl-dot"></div><span class="hl-t">文案工坊</span></div>
  <div class="hr">
    <span class="chip">已选 <b id="gC">0</b></span>
    <button class="btn btn-sm" onclick="randAll()">随机</button>
    <button class="btn btn-sm" onclick="exp()">导出</button>
    <button class="btn btn-sm" onclick="$('imF').click()">导入</button>
    <input type="file" id="imF" accept=".json" onchange="imp(this)" style="display:none">
    <button class="btn btn-d btn-sm" onclick="clr()">清空</button>
  </div>
</header>

<div class="ct">
  <div class="lp" id="lp">
    <div class="tb-scroll"><div class="tb" id="tb"></div></div>
  </div>

  <div class="rh" id="rh">
    <div class="pw">
      <div class="phone">
        <div class="pf"><div class="pd"></div>
          <div class="ps">
            <div class="xsb"><span>9:41</span><span>&#x2022;&#x2022;&#x2022;</span></div>
            <div class="xns">
              <div class="xu"><div class="xa">我</div><div class="xi"><div class="xn">小红书博主</div><span class="xt">刚刚</span></div><div class="xf">关注</div></div>
              <div class="xc"><div class="xc-t ph" id="pvCv">点击随机挑选文案</div><div class="xc-pg">1/1</div></div>
              <div class="xb"><div class="xb-t ph" id="pvTt">标题预览区</div><div class="xb-c ph" id="pvCt">正文内容将在这里显示</div></div>
              <div class="xb-loc ph" id="pvLoc">发布位置</div>
              <div class="xbar"><div class="xbar-i"><span class="xi">&#x2665;</span>赞</div><div class="xbar-i"><span class="xi">&#x1F4AC;</span>评</div><div class="xbar-i"><span class="xi">&#x2606;</span>藏</div><div class="xbar-i"><span class="xi">&#x2197;</span>分享</div></div>
              <div class="xcm ph" id="pvCm">评论区文案预览</div>
              <div class="xcm-hint">来聊聊吧</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bar">
      <button class="bbtn" onclick="cpy('cover')"><span class="bi">🖼</span>复制封面</button>
      <button class="bbtn" onclick="cpy('title')"><span class="bi">T</span>复制标题</button>
      <button class="bbtn" onclick="cpy('body')"><span class="bi">📝</span>复制正文</button>
      <button class="bbtn" onclick="cpy('cmts')"><span class="bi">💬</span>复制评论</button>
      <button class="bbtn" onclick="cpyAll()"><span class="bi">📋</span>复制全部</button>
    </div>
  </div>
</div>

<div class="mo hd" id="bm">
  <div class="mw">
    <h3 id="bmT">批量导入</h3><div class="hint">每行一条，空行跳过</div>
    <textarea id="bmTx" placeholder="粘贴文案…"></textarea>
    <div class="mwa"><button class="btn btn-sm" onclick="cb()">取消</button><button class="btn btn-p btn-sm" onclick="dbt()">确认</button></div>
  </div>
</div>

<div class="ts" id="ts"></div>

<script>
const M=['封面文案','标题文案','内容文案','普通话题','活动话题','评论区文案'];
const SK='xhs_v6';let d={items:[[],[],[],[],[],[]],selected:[[],[],[],[],[],[]]};let f=['','','','','',''];let bi=-1,curTab=0;

function $(s){return document.getElementById(s)}

function ld(){try{const r=localStorage.getItem(SK);if(r){const x=JSON.parse(r);if(x.items)d.items=x.items.slice();if(x.selected)d.selected=x.selected.slice()}}catch(e){for(let i=0;i<6;i++){d.items[i]=[];d.selected[i]=[]}}for(let i=0;i<6;i++){if(!Array.isArray(d.items[i]))d.items[i]=[];if(!Array.isArray(d.selected[i]))d.selected[i]=[]}}
function sv(){localStorage.setItem(SK,JSON.stringify(d))}
function es(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cp(t){navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已复制')})}
function toast(m){const e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('sh'),1200)}

function rn(i){
  const t=f[i],arr=d.items[i],sl=d.selected[i];
  const ct=$('l-'+i),st=$('s-'+i),ch=$('c-'+i);
  if(!ct||!st||!ch)return;
  const flt=t?arr.map((v,idx)=>({v,idx})).filter(o=>o.v.toLowerCase().includes(t)):arr.map((v,idx)=>({v,idx}));
  if(!arr.length){ct.innerHTML='<div class="emp">暂无文案<br>在下方输入框添加</div>'}
  else if(!flt.length){ct.innerHTML='<div class="emp">无匹配结果</div>'}
  else{
    ct.innerHTML=flt.map(({v,idx})=>{
      const s=sl.includes(idx);let tg='';if(i===3)tg='<span class="ctag">普通</span>';if(i===4)tg='<span class="ctag">活动</span>';
      return `<div class="card ${s?'sel':''}" onclick="tg(${i},${idx})">
        <input type="checkbox" class="cb" ${s?'checked':''} onclick="event.stopPropagation();tg(${i},${idx})">
        <div class="cbody"><div class="ctx">${es(v)}</div><div class="cmeta">${tg}<span class="clen">${v.length}字</span></div></div>
        <div class="cact"><button onclick="cpI(${i},${idx},event)">📋</button></div>
      </div>`
    }).join('')
  }
  const tl=arr.length,sl2=sl.length,sc=sl.reduce((s,idx)=>s+(arr[idx]||'').length,0);
  st.textContent=tl?`${tl}条 · 已选${sl2}`:'';ch.textContent=sl2?`共${sc}字`:'';
  const bd=$('bd-'+i);if(bd)bd.textContent=sl2||'';
}

function ua(){up();uh()}
function uh(){const t=d.selected.reduce((s,a)=>s+a.length,0);$('gC').textContent=t}

function up(){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);
  const cv=g(0),tl=g(1),ct=g(2),nt=g(3),et=g(4),cm=g(5);
  const eC=$('pvCv');if(cv.length){eC.textContent=cv.join('\n');eC.classList.remove('ph')}else{eC.textContent='封面文案预览';eC.classList.add('ph')}
  const eT=$('pvTt');if(tl.length){eT.textContent=tl.join(' ');eT.classList.remove('ph')}else{eT.textContent='标题预览区';eT.classList.add('ph')}
  const eCt=$('pvCt');
  if(ct.length||nt.length||et.length){
    let h='';if(ct.length)h+=es(ct.join('\n\n'));
    const al=[...nt.map(t=>({t,ty:'n'})),...et.map(t=>({t,ty:'e'}))];
    if(al.length)h+=(ct.length?'\n\n':'')+al.map(o=>`<span class="xb-h${o.ty==='e'?' ev':''}">#${es(o.t)}</span>`).join(' ');
    eCt.innerHTML=h;eCt.classList.remove('ph')
  }else{eCt.textContent='正文内容将在这里显示';eCt.classList.add('ph')}
  const eL=$('pvLoc');eL.textContent=(cv.length||tl.length||ct.length)?'📍 上海':'发布位置';eL.classList.toggle('ph',!(cv.length||tl.length||ct.length));
  const eCm=$('pvCm');
  if(cm.length){eCm.innerHTML=cm.map((c,k)=>`<div class="xcm-i"><span class="xcm-u">用户${k+1}</span>${es(c)}</div>`).join('');eCm.classList.remove('ph')}
  else{eCm.textContent='评论区文案预览';eCm.classList.add('ph')}
}

function add(i){const v=$('i-'+i).value.trim();if(!v)return;d.items[i].push(v);$('i-'+i).value='';sv();rn(i);ua()}
function tg(i,idx){const p=d.selected[i].indexOf(idx);if(p===-1)d.selected[i].push(idx);else d.selected[i].splice(p,1);sv();rn(i);ua()}
function rm(i,idx,e){e.stopPropagation();e.preventDefault();d.items[i].splice(idx,1);d.selected[i]=d.selected[i].filter(s=>s!==idx).map(s=>s>idx?s-1:s);sv();rn(i);ua()}
function cpI(i,idx,e){e.stopPropagation();e.preventDefault();cp(d.items[i][idx])}
function fl(i,v){f[i]=v.toLowerCase();rn(i)}

function randAll(){
  if(!d.items.some(a=>a.length)){toast('请先导入或添加文案');return}
  const pk=(i,cnt)=>{if(!d.items[i].length)return[];const n=Math.min(cnt,d.items[i].length);const po=shuf([...Array(d.items[i].length).keys()]);return po.slice(0,n).sort((a,b)=>a-b)};
  d.selected[0]=pk(0,1);d.selected[1]=pk(1,1);d.selected[2]=pk(2,1);d.selected[3]=pk(3,9);d.selected[4]=pk(4,1);d.selected[5]=pk(5,1);
  sv();for(let i=0;i<6;i++)rn(i);ua();toast('已随机挑选一套文案')
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function cpyAll(){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);
  const p=[];const cv=g(0).join('\n');if(cv)p.push('【封面】\n'+cv);
  const tl=g(1).join(' ');if(tl)p.push('【标题】\n'+tl);
  const ct=g(2).join('\n\n'),nt=g(3).map(x=>'#'+x).join(' '),et=g(4).map(x=>'#'+x).join(' ');
  const tags=[nt,et].filter(Boolean).join(' ');
  if(ct||tags)p.push('【正文】\n'+(ct||'')+(ct&&tags?'\n\n':'')+(tags||''));
  const cm=g(5).join('\n');if(cm)p.push('【评论区】\n'+cm);
  if(!p.length){toast('请先选择文案');return}cp(p.join('\n\n'))
}
function cpy(m){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);let t='';
  if(m==='cover')t=g(0).join('\n');
  else if(m==='title')t=g(1).join(' ');
  else if(m==='body'){const ct=g(2).join('\n\n'),nt=g(3).map(x=>'#'+x).join(' '),et=g(4).map(x=>'#'+x).join(' ');t=(ct||'')+(ct&&(nt||et)?'\n\n':'')+[nt,et].filter(Boolean).join(' ')}
  else if(m==='cmts')t=g(5).join('\n');
  if(!t){toast('该模块未选择文案');return}cp(t)
}

function bat(i){bi=i;$('bmT').textContent='批量导入 - '+M[i];$('bmTx').value='';$('bm').classList.remove('hd');setTimeout(()=>$('bmTx').focus(),50)}
function cb(){$('bm').classList.add('hd');bi=-1}
function dbt(){const ls=$('bmTx').value.split('\n').map(l=>l.trim()).filter(l=>l);if(!ls.length||bi<0){cb();return}d.items[bi]=d.items[bi].concat(ls);sv();rn(bi);ua();cb()}

function exp(){const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xhs-bank-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.items){for(let i=0;i<6;i++)if(Array.isArray(x.items[i]))d.items[i]=d.items[i].concat(x.items[i])}else if(x.cover||x.title){d.items[0]=d.items[0].concat(x.cover||[]);d.items[1]=d.items[1].concat(x.title||[]);d.items[2]=d.items[2].concat(x.content||[]);d.items[3]=d.items[3].concat(x.topics||[]);d.items[4]=d.items[4].concat(x.activities||[]);d.items[5]=d.items[5].concat(x.comments||[])}if(x.selected)for(let i=0;i<6;i++)if(Array.isArray(x.selected[i]))d.selected[i]=x.selected[i];sv();for(let i=0;i<6;i++)rn(i);ua();toast('导入完成')}catch(e){toast('文件格式错误')}};r.readAsText(f);inp.value=''}
function clr(){if(!confirm('确定清空全部文案？'))return;d={items:[[],[],[],[],[],[]],selected:[[],[],[],[],[],[]]};sv();for(let i=0;i<6;i++)rn(i);ua()}

function sw(i){
  curTab=i;
  document.querySelectorAll('.tb-i').forEach((t,idx)=>t.classList.toggle('act',idx===i));
  document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('hidden',idx!==i));
}

function initPanels(){
  const lp=$('lp');
  const html=M.map((n,i)=>`
    <div class="panel ${i===0?'':'hidden'}">
      <div class="srch"><input class="si" id="si-${i}" placeholder="搜索${n}…" oninput="fl(${i},this.value)"></div>
      <div class="clist" id="l-${i}"></div>
      <div class="ft">
        <div class="fr">
          <input id="i-${i}" placeholder="添加${n}…" onkeydown="if(event.key==='Enter')add(${i})">
          <button class="btn btn-p btn-sm" onclick="add(${i})">添加</button>
          <button class="btn btn-sm" onclick="bat(${i})">批量</button>
        </div>
        <div class="fb"><span id="s-${i}"></span><span id="c-${i}"></span></div>
      </div>
    </div>`).join('');
  lp.insertAdjacentHTML('beforeend',html);
}

ld();
$('tb').innerHTML=M.map((n,i)=>`<div class="tb-i ${i===0?'act':''}" onclick="sw(${i})">${n}<span class="tb-b" id="bd-${i}">0</span></div>`).join('');
initPanels();
rn(0);ua();
</script>
</body>
</html>
