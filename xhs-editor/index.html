<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="小红书文案工坊 — 自由组合封面、标题、正文、话题、评论，一键复制发布。">
<meta name="keywords" content="小红书文案,文案编辑器,小红书排版,内容创作,文案模板">
<title>文案工坊 — EasyDoIt</title>
<style>
/* ============================================
   DESIGN SYSTEM — EasyDoIt 文案工坊
   Flat Design / Neutral Grayscale / Blue Accent
   No Shadows / No Gradients / No Decorations
   ============================================ */

/* --- Design Tokens --- */
:root{
  --gray-50:#fafafa;--gray-100:#f4f4f5;--gray-200:#e4e4e7;--gray-300:#d4d4d8;
  --gray-400:#a1a1aa;--gray-500:#71717a;--gray-600:#52525b;--gray-700:#3f3f46;
  --gray-800:#27272a;--gray-900:#18181b;--gray-950:#09090b;
  --blue-50:#eff6ff;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;
  --red-500:#ef4444;--rose-500:#f43f5e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Fira Code","Cascadia Code",monospace;

  /* Light theme */
  --color-bg:var(--gray-50);
  --color-surface:var(--gray-50);
  --color-surface2:var(--gray-100);
  --color-border:var(--gray-200);
  --color-text:var(--gray-950);
  --color-text2:var(--gray-500);
  --color-text3:var(--gray-400);
  --color-accent:var(--blue-600);
  --color-accent-hover:var(--blue-700);
  --color-accent-soft:var(--blue-50);
  --color-accent-border:var(--blue-500);

  --radius-sm:4px;--radius:6px;--radius-lg:10px;
  --ease:150ms ease;
}

@media(prefers-color-scheme:dark){
  :root{
    --color-bg:var(--gray-950);
    --color-surface:var(--gray-900);
    --color-surface2:var(--gray-800);
    --color-border:var(--gray-700);
    --color-text:#fafafa;
    --color-text2:var(--gray-400);
    --color-text3:var(--gray-500);
    --color-accent:var(--blue-500);
    --color-accent-hover:#60a5fa;
    --color-accent-soft:#1e3a5f;
    --color-accent-border:var(--blue-500);
  }
}

/* --- Reset & Base --- */
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--color-bg);color:var(--color-text);
  height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;font-size:13px;line-height:1.5;
}
::selection{background:var(--color-accent-soft)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:4px}

/* --- Header --- */
.hdr{
  height:44px;padding:0 12px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
}
.hl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:-.02em}
.hl-dot{width:6px;height:6px;border-radius:3px;background:var(--color-accent)}
.hr{display:flex;align-items:center;gap:4px}
.btn{
  height:26px;padding:0 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
  cursor:pointer;font-size:11px;font-weight:500;font-family:var(--font);line-height:24px;
  background:var(--color-surface);color:var(--color-text2);
  transition:all var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--color-surface2);color:var(--color-text)}
.btn:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.btn-p{background:var(--color-accent);color:#fff;border-color:var(--color-accent);font-weight:600}
.btn-p:hover{background:var(--color-accent-hover);border-color:var(--color-accent-hover)}
.btn-d{color:var(--color-accent);border:none;background:transparent;padding:0 8px}
.btn-d:hover{background:var(--color-accent-soft)}
.chip{
  font-size:11px;font-weight:600;color:var(--color-accent);
  background:var(--color-accent-soft);padding:1px 8px;border-radius:var(--radius-sm);
  line-height:22px;border:1px solid transparent;
}

/* --- Main Layout --- */
.ct{display:flex;flex:1;overflow:hidden}

/* --- Left Panel --- */
.lp{
  width:268px;min-width:200px;background:var(--color-surface);
  border-right:1px solid var(--color-border);display:flex;
  flex-direction:column;overflow:hidden;flex-shrink:0;
}

/* Tabs */
.tb-scroll{padding:6px 8px 4px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--color-border)}
.tb-scroll::-webkit-scrollbar{display:none}
.tb{display:flex;gap:0;min-width:fit-content}
.tb-i{
  flex:0 0 auto;padding:5px 10px;text-align:center;
  font-size:11px;font-weight:500;color:var(--color-text2);
  cursor:pointer;position:relative;user-select:none;
  transition:color var(--ease);border-bottom:2px solid transparent;
}
.tb-i:hover{color:var(--color-text)}
.tb-i.act{color:var(--color-text);font-weight:600;border-bottom-color:var(--color-accent)}
.tb-b{position:absolute;top:0;right:-2px;font-size:9px;font-weight:700;color:var(--color-accent)}
.tb-i.act .tb-b{color:var(--color-accent)}

/* Panel */
.panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.panel.hidden{display:none}

/* Search */
.srch{padding:6px 8px 0;flex-shrink:0}
.srch input{
  width:100%;height:30px;padding:0 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
  background:var(--color-surface2);color:var(--color-text);font-size:11px;font-family:var(--font);
  outline:none;transition:border-color var(--ease);
}
.srch input:focus{border-color:var(--color-accent);background:var(--color-surface)}
.srch input::placeholder{color:var(--color-text3)}

/* List */
.clist{flex:1;overflow-y:auto;padding:4px 6px 6px}
.card{
  display:flex;align-items:flex-start;gap:6px;
  padding:5px 6px;border-radius:var(--radius-sm);cursor:pointer;
  border-left:2px solid transparent;transition:background var(--ease),border-color var(--ease);
}
.card:hover{background:var(--color-surface2)}
.card.sel{border-left-color:var(--color-accent-border)}
.card.sel:hover{background:var(--color-surface2)}
.card .cb{
  appearance:none;-webkit-appearance:none;
  width:12px;height:12px;border-radius:3px;
  border:1.5px solid var(--color-border);flex-shrink:0;cursor:pointer;
  position:relative;margin-top:1px;transition:all var(--ease);
}
.card .cb:hover{border-color:var(--color-text3)}
.card .cb:checked{background:var(--color-accent);border-color:var(--color-accent)}
.card .cb:checked::after{
  content:'';position:absolute;left:3px;top:.5px;
  width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg);
}
.card .cb:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.card .cbody{flex:1;min-width:0}
.card .ctx{font-size:12px;line-height:1.4;word-break:break-word}
.card .cmeta{display:flex;align-items:center;gap:4px;margin-top:2px}
.card .ctag{font-size:10px;padding:0 4px;border-radius:2px;color:var(--color-text2);border:1px solid var(--color-border)}
.card .clen{font-size:10px;color:var(--color-text3)}
.card .cact{margin-left:2px;flex-shrink:0;display:flex;align-items:center;opacity:0;transition:opacity var(--ease)}
.card:hover .cact{opacity:1}
.card .cact button{
  background:none;border:none;color:var(--color-text3);cursor:pointer;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);font-size:11px;transition:all var(--ease);
}
.card .cact button:hover{color:var(--color-text);background:var(--color-border)}

/* Empty state */
.emp{padding:32px 0;text-align:center;color:var(--color-text3);font-size:12px;line-height:1.6}

/* Footer input */
.ft{padding:6px 8px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--color-border)}
.fr{display:flex;gap:4px}
.fr input{
  flex:1;height:30px;padding:0 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
  background:var(--color-surface2);color:var(--color-text);font-size:11px;font-family:var(--font);
  outline:none;transition:border-color var(--ease);
}
.fr input:focus{border-color:var(--color-accent);background:var(--color-surface)}
.fr input::placeholder{color:var(--color-text3)}
.fb{font-size:10px;color:var(--color-text3);display:flex;justify-content:space-between}

/* --- Right Area --- */
.rh{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:16px 20px 12px;gap:16px;min-width:0;
}

/* Phone Model */
.phone{
  width:340px;flex-shrink:0;
  border-radius:32px;background:var(--color-gray-800,#27272a);
  padding:8px;position:relative;
  box-shadow:0 4px 24px rgba(0,0,0,.08);
  transition:width var(--ease);
}
.pf{
  width:100%;aspect-ratio:390/760;background:#0a0a0f;
  border-radius:26px;overflow:hidden;position:relative;
}
.pd{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:60px;height:6px;background:rgba(255,255,255,.15);
  border-radius:3px;z-index:10;
}
.ps{
  width:100%;height:100%;background:#fff;border-radius:26px;
  overflow:hidden;display:flex;flex-direction:column;
}

/* Phone Content — Resets to white */
.xsb{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px 4px;font-size:10px;font-weight:700;color:#0f0f0f;flex-shrink:0;
}
.xns{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.xns::-webkit-scrollbar{width:0}

.xu{display:flex;align-items:center;gap:5px;padding:4px 12px;flex-shrink:0}
.xa{width:20px;height:20px;border-radius:50%;background:#ff2442;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:800}
.xn{font-size:9px;font-weight:700;color:#0f0f0f}
.xt{font-size:7px;color:#999;margin-left:3px}
.xf{font-size:7px;font-weight:600;color:#ff2442;border:1px solid #ffe0e5;border-radius:8px;padding:2px 6px;background:#fff;cursor:default;flex-shrink:0;margin-left:auto}

.xc{
  width:100%;aspect-ratio:1;flex-shrink:0;
  background:linear-gradient(150deg,#0f1018,#141828,#101524);
  display:flex;align-items:center;justify-content:center;
  padding:20px;position:relative;overflow:hidden;
  border-bottom:1px solid rgba(0,0,0,.05);
}
.xc-t{position:relative;font-size:13px;font-weight:800;color:#fff;text-align:center;line-height:1.35;word-break:break-word;letter-spacing:-.01em}
.xc-t.ph{font-size:9px;font-weight:400;color:rgba(255,255,255,.07)}
.xc-pg{position:absolute;bottom:6px;right:8px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:rgba(255,255,255,.5);font-size:7px;padding:1px 6px;border-radius:4px}

.xb{padding:6px 12px 2px;flex-shrink:0}
.xb-t{font-size:11px;font-weight:800;color:#0f0f0f;line-height:1.35;word-break:break-word;letter-spacing:-.01em}
.xb-t.ph{color:#e0e0e0;font-weight:500;font-size:8px}
.xb-c{font-size:8px;color:#333;line-height:1.75;white-space:pre-wrap;word-break:break-word;padding-top:2px}
.xb-c.ph{color:#e8e8e8}
.xb-h{color:#2b67d9;text-decoration:none;font-size:8px;margin-right:2px}
.xb-h.ev{color:#e0761e;font-weight:600}
.xb-loc{padding:0 12px 2px;font-size:7px;color:#999;flex-shrink:0}
.xb-loc.ph{color:#e8e8e8}

.xbar{
  display:flex;justify-content:space-around;padding:2px 12px;flex-shrink:0;
  border-top:1px solid rgba(0,0,0,.04);margin:0 12px;
}
.xbar-i{font-size:7px;color:#999;cursor:default;font-family:var(--font);flex:1;padding:4px 0;text-align:center;display:flex;align-items:center;justify-content:center;gap:2px}
.xbar-i .xi{font-size:12px;line-height:1}

.xcm{padding:4px 12px 6px;flex-shrink:0}
.xcm-i{font-size:7px;color:#555;line-height:1.5}
.xcm-u{font-weight:700;color:#333;margin-right:2px}
.xcm.ph{color:#e8e8e8;font-size:7px}
.xcm-hint{font-size:7px;color:#ccc;text-align:center;padding:4px 0}

/* Action Bar */
.bar{
  display:flex;gap:1px;flex-shrink:0;
  background:var(--color-surface2);border-radius:var(--radius);
  padding:2px;border:1px solid var(--color-border);
}
.bbtn{
  display:flex;align-items:center;gap:4px;
  height:32px;padding:0 12px;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font-family:var(--font);font-size:11px;font-weight:600;
  color:var(--color-text2);background:transparent;
  transition:all var(--ease);white-space:nowrap;
}
.bbtn:hover{background:var(--color-surface);color:var(--color-text)}
.bbtn:focus-visible{outline:2px solid var(--color-accent);outline-offset:-1px}
.bbtn .bi{font-size:13px;line-height:1}

/* --- Modal --- */
.mo{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.mo.hd{display:none}
.mw{
  background:var(--color-surface);border-radius:var(--radius-lg);
  width:380px;max-width:92vw;padding:24px;
  border:1px solid var(--color-border);
}
.mw h3{font-size:14px;font-weight:700;margin-bottom:4px}
.mw .hint{font-size:11px;color:var(--color-text2);margin-bottom:12px}
.mw textarea{
  width:100%;min-height:140px;padding:10px 12px;line-height:1.6;
  border:1px solid var(--color-border);border-radius:var(--radius-sm);
  background:var(--color-surface2);color:var(--color-text);
  font-size:11px;font-family:var(--font);resize:vertical;outline:none;
}
.mw textarea:focus{border-color:var(--color-accent);background:var(--color-surface)}
.mw textarea::placeholder{color:var(--color-text3)}
.mwa{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}

/* --- Toast --- */
.ts{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:var(--gray-800);color:#fff;border-radius:var(--radius);
  padding:6px 16px;font-size:11px;font-weight:500;z-index:300;
  pointer-events:none;opacity:0;transition:opacity var(--ease);
}
.ts.sh{opacity:1}

/* --- Responsive --- */
@media(max-width:900px){
  .ct{flex-direction:column}
  .lp{width:100%;min-width:0;flex:1 1 45%}
  .rh{flex:1 1 55%;padding:12px;gap:10px}
  .phone{width:280px;border-radius:24px;padding:6px}
  .pf{border-radius:20px}.ps{border-radius:20px}
  .pd{top:6px;width:44px}
  .xc{padding:14px}.xc-t{font-size:11px}
  .xb-t{font-size:9px}.xb-c{font-size:7px}
}
@media(max-width:520px){
  body{overflow-y:auto}
  .ct{overflow-y:auto}
  .lp{flex:0 0 auto;max-height:42vh;border-right:none;border-bottom:1px solid var(--color-border)}
  .rh{flex:1 0 auto;min-height:52vh;padding:8px}
  .hdr{padding:0 8px}
  .phone{width:220px;border-radius:20px;padding:5px}
  .pf{border-radius:16px}.ps{border-radius:16px}
  .pd{top:4px;width:32px;height:4px}
  .bar{gap:0;padding:1px}
  .bbtn{height:28px;padding:0 8px;font-size:10px;gap:3px}
  .bbtn .bi{font-size:11px}
  .tb-i{padding:4px 8px;font-size:10px}
}

@media(prefers-reduced-motion:reduce){
  *,::before,::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hl"><div class="hl-dot"></div>文案工坊</div>
  <div class="hr">
    <span class="chip">已选 <b id="gC">0</b></span>
    <button class="btn" onclick="randAll()">随机</button>
    <button class="btn" onclick="exp()">导出</button>
    <button class="btn" onclick="$('imF').click()">导入</button>
    <input type="file" id="imF" accept=".json" onchange="imp(this)" style="display:none">
    <button class="btn btn-d" onclick="clr()">清空</button>
  </div>
</header>

<div class="ct">
  <!-- Left Panel -->
  <div class="lp" id="lp">
    <div class="tb-scroll"><div class="tb" id="tb"></div></div>
  </div>

  <!-- Right: Phone Preview -->
  <div class="rh">
    <div class="phone">
      <div class="pf"><div class="pd"></div>
        <div class="ps">
          <div class="xsb"><span>9:41</span><span>&#x2022;&#x2022;&#x2022;</span></div>
          <div class="xns">
            <div class="xu"><div class="xa">我</div><div class="xn">小红书博主</div><span class="xt">刚刚</span><div class="xf">关注</div></div>
            <div class="xc"><div class="xc-t ph" id="pvCv">封面预览</div><div class="xc-pg">1/1</div></div>
            <div class="xb"><div class="xb-t ph" id="pvTt">标题预览区</div><div class="xb-c ph" id="pvCt">正文内容将在此显示</div></div>
            <div class="xb-loc ph" id="pvLoc">发布位置</div>
            <div class="xbar"><div class="xbar-i"><span class="xi">&#x2665;</span>赞</div><div class="xbar-i"><span class="xi">&#x1F4AC;</span>评</div><div class="xbar-i"><span class="xi">&#x2606;</span>藏</div><div class="xbar-i"><span class="xi">&#x2197;</span>分享</div></div>
            <div class="xcm ph" id="pvCm">评论区文案预览</div>
            <div class="xcm-hint">来聊聊吧</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bar">
      <button class="bbtn" onclick="cpy('cover')"><span class="bi">&#x1F5BC;</span>封面</button>
      <button class="bbtn" onclick="cpy('title')"><span class="bi">T</span>标题</button>
      <button class="bbtn" onclick="cpy('body')"><span class="bi">&#x1F4DD;</span>正文</button>
      <button class="bbtn" onclick="cpy('cmts')"><span class="bi">&#x1F4AC;</span>评论</button>
      <button class="bbtn" onclick="cpyAll()"><span class="bi">&#x1F4CB;</span>全篇</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="mo hd" id="bm">
  <div class="mw">
    <h3 id="bmT">批量导入</h3><div class="hint">每行一条，空行自动跳过</div>
    <textarea id="bmTx" placeholder="粘贴文案…" spellcheck="false"></textarea>
    <div class="mwa"><button class="btn" onclick="cb()">取消</button><button class="btn btn-p" onclick="dbt()">确认</button></div>
  </div>
</div>

<!-- Toast -->
<div class="ts" id="ts"></div>

<script>
/* ============================================
   APPLICATION LOGIC — Preserved from v8
   ============================================ */
const M=['封面文案','标题文案','内容文案','普通话题','活动话题','评论区文案'];
const SK='xhs_v9';let d={items:[[],[],[],[],[],[]],selected:[[],[],[],[],[],[]]};
let f=['','','','','',''];let bi=-1,curTab=0;

function $(s){return document.getElementById(s)}
function ld(){
  try{
    const r=localStorage.getItem(SK);
    if(r){const x=JSON.parse(r);if(x.items)d.items=x.items.slice();if(x.selected)d.selected=x.selected.slice()}
  }catch(e){}
  for(let i=0;i<6;i++){if(!Array.isArray(d.items[i]))d.items[i]=[];if(!Array.isArray(d.selected[i]))d.selected[i]=[]}
}
function sv(){localStorage.setItem(SK,JSON.stringify(d))}
function es(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function toast(m){const e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('sh'),1200)}

function cp(t){
  navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;
    ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已复制')
  })
}

function rn(i){
  const t=f[i],arr=d.items[i],sl=d.selected[i];
  const ct=$('l-'+i),st=$('s-'+i),ch=$('c-'+i);
  if(!ct||!st||!ch)return;
  const flt=t?arr.map((v,idx)=>({v,idx})).filter(o=>o.v.toLowerCase().includes(t)):arr.map((v,idx)=>({v,idx}));
  if(!arr.length){ct.innerHTML='<div class="emp">暂无文案<br><span style="font-size:11px">在下方输入框添加或导入</span></div>'}
  else if(!flt.length){ct.innerHTML='<div class="emp">无匹配结果</div>'}
  else{
    ct.innerHTML=flt.map(({v,idx})=>{
      const s=sl.includes(idx);let tg='';if(i===3)tg='<span class="ctag">普通</span>';if(i===4)tg='<span class="ctag">活动</span>';
      return `<div class="card ${s?'sel':''}" onclick="tg(${i},${idx})">
        <input type="checkbox" class="cb" ${s?'checked':''} onclick="event.stopPropagation();tg(${i},${idx})" aria-label="选择此条">
        <div class="cbody"><div class="ctx">${es(v)}</div><div class="cmeta">${tg}<span class="clen">${v.length}字</span></div></div>
        <div class="cact"><button onclick="cpI(${i},${idx},event)" aria-label="复制此条">&#x2398;</button></div>
      </div>`
    }).join('')
  }
  const tl=arr.length,sl2=sl.length,sc=sl.reduce((s,idx)=>s+(arr[idx]||'').length,0);
  st.textContent=tl?`${tl}条`+(sl2?` · 已选${sl2}`:''):'';ch.textContent=sl2?`${sc}字`:'';
  const bd=$('bd-'+i);if(bd)bd.textContent=sl2||''
}

function ua(){up();uh()}
function uh(){const t=d.selected.reduce((s,a)=>s+a.length,0);$('gC').textContent=t}
function up(){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);
  const cv=g(0),tl=g(1),ct=g(2),nt=g(3),et=g(4),cm=g(5);

  const eC=$('pvCv');
  if(cv.length){eC.textContent=cv.join('\n');eC.classList.remove('ph')}else{eC.textContent='封面预览';eC.classList.add('ph')}

  const eT=$('pvTt');
  if(tl.length){eT.textContent=tl.join(' ');eT.classList.remove('ph')}else{eT.textContent='标题预览区';eT.classList.add('ph')}

  const eCt=$('pvCt');
  if(ct.length||nt.length||et.length){
    let h='';if(ct.length)h+=es(ct.join('\n\n'));
    const al=[...nt.map(t=>({t,ty:'n'})),...et.map(t=>({t,ty:'e'}))];
    if(al.length)h+=(ct.length?'\n\n':'')+al.map(o=>`<span class="xb-h${o.ty==='e'?' ev':''}">#${es(o.t)}</span>`).join(' ');
    eCt.innerHTML=h;eCt.classList.remove('ph')
  }else{eCt.textContent='正文内容将在此显示';eCt.classList.add('ph')}

  const eL=$('pvLoc');
  eL.textContent=(cv.length||tl.length||ct.length)?'\u{1F4CD} 上海':'发布位置';
  eL.classList.toggle('ph',!(cv.length||tl.length||ct.length));

  const eCm=$('pvCm');
  if(cm.length){eCm.innerHTML=cm.map((c,k)=>`<div class="xcm-i"><span class="xcm-u">用户${k+1}</span>${es(c)}</div>`).join('');eCm.classList.remove('ph')}
  else{eCm.textContent='评论区文案预览';eCm.classList.add('ph')}
}

function add(i){const v=$('i-'+i).value.trim();if(!v)return;d.items[i].push(v);$('i-'+i).value='';sv();rn(i);ua()}
function tg(i,idx){const p=d.selected[i].indexOf(idx);if(p===-1)d.selected[i].push(idx);else d.selected[i].splice(p,1);sv();rn(i);ua()}
function cpI(i,idx,e){e.stopPropagation();e.preventDefault();cp(d.items[i][idx])}
function fl(i,v){f[i]=v.toLowerCase();rn(i)}

function randAll(){
  if(!d.items.some(a=>a.length)){toast('请先导入或添加文案');return}
  const pk=(i,cnt)=>{if(!d.items[i].length)return[];const n=Math.min(cnt,d.items[i].length);const po=shuf([...Array(d.items[i].length).keys()]);return po.slice(0,n).sort((a,b)=>a-b)};
  d.selected[0]=pk(0,1);d.selected[1]=pk(1,1);d.selected[2]=pk(2,1);d.selected[3]=pk(3,9);d.selected[4]=pk(4,1);d.selected[5]=pk(5,1);
  sv();for(let i=0;i<6;i++)rn(i);ua();toast('已随机挑选一套文案')
}

function cpyAll(){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);
  const p=[];
  const cv=g(0).join('\n');if(cv)p.push('【封面】\n'+cv);
  const tl=g(1).join(' ');if(tl)p.push('【标题】\n'+tl);
  const ct=g(2).join('\n\n'),nt=g(3).map(x=>'#'+x).join(' '),et=g(4).map(x=>'#'+x).join(' ');
  const tags=[nt,et].filter(Boolean).join(' ');
  if(ct||tags)p.push('【正文】\n'+(ct||'')+(ct&&tags?'\n\n':'')+(tags||''));
  const cm=g(5).join('\n');if(cm)p.push('【评论区】\n'+cm);
  if(!p.length){toast('请先选择文案');return}cp(p.join('\n\n'))
}
function cpy(m){
  const g=i=>d.selected[i].map(idx=>d.items[i][idx]);let t='';
  if(m==='cover')t=g(0).join('\n');
  else if(m==='title')t=g(1).join(' ');
  else if(m==='body'){const ct=g(2).join('\n\n'),nt=g(3).map(x=>'#'+x).join(' '),et=g(4).map(x=>'#'+x).join(' ');t=(ct||'')+(ct&&(nt||et)?'\n\n':'')+[nt,et].filter(Boolean).join(' ')}
  else if(m==='cmts')t=g(5).join('\n');
  if(!t){toast('该模块未选择文案');return}cp(t)
}

function bat(i){bi=i;$('bmT').textContent='批量导入 - '+M[i];$('bmTx').value='';$('bm').classList.remove('hd');setTimeout(()=>$('bmTx').focus(),60)}
function cb(){$('bm').classList.add('hd');bi=-1}
function dbt(){const ls=$('bmTx').value.split('\n').map(l=>l.trim()).filter(l=>l);if(!ls.length||bi<0){cb();return}d.items[bi]=d.items[bi].concat(ls);sv();rn(bi);ua();cb()}

function exp(){const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xhs-bank-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.items){for(let i=0;i<6;i++)if(Array.isArray(x.items[i]))d.items[i]=d.items[i].concat(x.items[i])}else if(x.cover||x.title){d.items[0]=d.items[0].concat(x.cover||[]);d.items[1]=d.items[1].concat(x.title||[]);d.items[2]=d.items[2].concat(x.content||[]);d.items[3]=d.items[3].concat(x.topics||[]);d.items[4]=d.items[4].concat(x.activities||[]);d.items[5]=d.items[5].concat(x.comments||[])}if(x.selected)for(let i=0;i<6;i++)if(Array.isArray(x.selected[i]))d.selected[i]=x.selected[i];sv();for(let i=0;i<6;i++)rn(i);ua();toast('导入完成')}catch(e){toast('文件格式错误')}};r.readAsText(f);inp.value=''}
function clr(){if(!confirm('确定清空全部文案？此操作不可恢复。'))return;d={items:[[],[],[],[],[],[]],selected:[[],[],[],[],[],[]]};sv();for(let i=0;i<6;i++)rn(i);ua()}

function sw(i){
  curTab=i;
  document.querySelectorAll('.tb-i').forEach((t,idx)=>t.classList.toggle('act',idx===i));
  document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('hidden',idx!==i));
}

function initPanels(){
  const lp=$('lp');
  const html=M.map((n,i)=>`
    <div class="panel ${i===0?'':'hidden'}">
      <div class="srch"><input id="si-${i}" placeholder="搜索${n}…" oninput="fl(${i},this.value)" spellcheck="false"></div>
      <div class="clist" id="l-${i}"></div>
      <div class="ft">
        <div class="fr">
          <input id="i-${i}" placeholder="添加${n}…" onkeydown="if(event.key==='Enter')add(${i})" spellcheck="false">
          <button class="btn btn-p" onclick="add(${i})">添加</button>
          <button class="btn" onclick="bat(${i})">批量</button>
        </div>
        <div class="fb"><span id="s-${i}"></span><span id="c-${i}"></span></div>
      </div>
    </div>`).join('');
  lp.insertAdjacentHTML('beforeend',html);
}

ld();
$('tb').innerHTML=M.map((n,i)=>`<div class="tb-i ${i===0?'act':''}" onclick="sw(${i})">${n}<span class="tb-b" id="bd-${i}">0</span></div>`).join('');
initPanels();
rn(0);ua();
</script>
</body>
</html>
