<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Collage Maker — 拼图工具</title>
<style>
:root {
  --bg: oklch(0.98 0 0);
  --bg-card: oklch(1 0 0 / 0.82);
  --bg-elevated: oklch(1 0 0 / 0.92);
  --text: oklch(0.18 0 0);
  --text-secondary: oklch(0.48 0 0);
  --text-tertiary: oklch(0.68 0 0);
  --border: oklch(0.88 0 0);
  --accent: oklch(0.62 0.19 253);
  --accent-hover: oklch(0.58 0.22 253);
  --accent-light: oklch(0.88 0.06 253);
  --danger: oklch(0.58 0.23 23);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04);
  --shadow: 0 2px 8px oklch(0 0 0 / 0.06), 0 0 0 0.5px oklch(0 0 0 / 0.04);
  --shadow-lg: 0 8px 32px oklch(0 0 0 / 0.1), 0 0 0 0.5px oklch(0 0 0 / 0.06);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
  --transition-slow: 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
}

[data-theme="dark"] {
  --bg: oklch(0.15 0 0);
  --bg-card: oklch(0.2 0 0 / 0.82);
  --bg-elevated: oklch(0.24 0 0 / 0.92);
  --text: oklch(0.92 0 0);
  --text-secondary: oklch(0.62 0 0);
  --text-tertiary: oklch(0.45 0 0);
  --border: oklch(0.28 0 0);
  --accent-light: oklch(0.28 0.06 253);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow: 0 2px 8px oklch(0 0 0 / 0.3), 0 0 0 0.5px oklch(0 0 0 / 0.2);
  --shadow-lg: 0 8px 32px oklch(0 0 0 / 0.4), 0 0 0 0.5px oklch(0 0 0 / 0.25);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Header */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 0.5px solid var(--border);
  padding: 0 20px; height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
header .logo {
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 8px;
}
header .logo svg { width: 20px; height: 20px; }
header .actions { display: flex; align-items: center; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; font-family: inherit;
  border: none; cursor: pointer; transition: var(--transition);
  white-space: nowrap; letter-spacing: -0.01em;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--border); color: var(--text); }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); width: 32px; height: 32px; }

/* Main Layout */
main {
  display: flex; gap: 0;
  height: calc(100vh - 48px);
  height: calc(100dvh - 48px);
  overflow: hidden;
}

/* Left Panel */
.panel-left {
  width: 300px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-right: 0.5px solid var(--border);
  background: var(--bg-card);
  overflow: hidden;
}
.panel-section {
  padding: 16px;
  border-bottom: 0.5px solid var(--border);
}
.panel-section:last-child { border-bottom: none; }
.panel-section h3 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-tertiary);
  margin-bottom: 10px;
}

/* Upload */
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 24px 16px; text-align: center; cursor: pointer;
  transition: var(--transition); background: transparent;
  min-height: 100px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--accent); background: var(--accent-light);
}
.upload-zone svg { width: 28px; height: 28px; color: var(--text-tertiary); }
.upload-zone p { font-size: 12px; color: var(--text-tertiary); }
.upload-zone span { font-size: 11px; color: var(--text-tertiary); opacity: 0.7; }

/* Photo List */
.photo-list {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 8px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.photo-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; border-radius: var(--radius-sm);
  background: var(--bg-elevated); border: 0.5px solid var(--border);
  cursor: grab; transition: var(--transition); user-select: none;
  position: relative;
}
.photo-item:hover { border-color: var(--accent); }
.photo-item.dragging { opacity: 0.5; border-color: var(--accent); box-shadow: var(--shadow-lg); }
.photo-item .thumb {
  width: 44px; height: 44px; border-radius: 6px;
  object-fit: cover; flex-shrink: 0; background: var(--border);
}
.photo-item .info { flex: 1; min-width: 0; }
.photo-item .info .name {
  font-size: 12px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.photo-item .info .meta { font-size: 11px; color: var(--text-tertiary); }
.photo-item .remove {
  width: 24px; height: 24px; border-radius: 50%;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); transition: var(--transition); flex-shrink: 0;
}
.photo-item .remove:hover { background: var(--danger); color: #fff; }
.photo-count {
  font-size: 11px; color: var(--text-tertiary); text-align: center;
  padding: 6px 0;
}

/* Center Preview */
.panel-center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
  background: var(--bg);
  overflow: auto;
  position: relative;
}
.preview-wrapper {
  position: relative;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  max-width: 100%; max-height: 100%;
}
.preview-grid {
  display: grid; gap: 4px;
  width: 100%; height: 100%;
}
.preview-grid .cell {
  background: var(--border); border-radius: 2px;
  overflow: hidden; position: relative;
  transition: var(--transition);
}
.preview-grid .cell img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.preview-grid .cell.empty {
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 12px;
}
.empty-state {
  text-align: center; color: var(--text-tertiary);
}
.empty-state svg { width: 56px; height: 56px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 14px; }

/* Right Panel */
.panel-right {
  width: 280px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-left: 0.5px solid var(--border);
  background: var(--bg-card);
  overflow: hidden;
}
.template-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.template-card {
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 4px; cursor: pointer; transition: var(--transition);
  background: var(--bg-elevated);
  display: flex; flex-direction: column; gap: 3px;
}
.template-card:hover { border-color: var(--accent); }
.template-card.active { border-color: var(--accent); background: var(--accent-light); }
.template-card .preview-mini {
  display: grid; gap: 2px; aspect-ratio: 1;
  border-radius: 4px; overflow: hidden;
}
.template-card .preview-mini div {
  background: var(--border); border-radius: 1px;
}
.template-card .label {
  font-size: 10px; text-align: center; color: var(--text-secondary);
  font-weight: 500;
}

/* Controls */
.control-group { margin-bottom: 12px; }
.control-group:last-child { margin-bottom: 0; }
.control-group label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;
  font-weight: 500;
}
.control-group label .val { color: var(--text-tertiary); font-weight: 400; font-size: 11px; }
input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 4px;
  background: var(--border); border-radius: 2px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }
select {
  width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
  border: 0.5px solid var(--border); background: var(--bg-elevated);
  font-size: 12px; font-family: inherit; color: var(--text);
  cursor: pointer; transition: var(--transition);
}
select:focus { outline: none; border-color: var(--accent); }
.color-row { display: flex; gap: 6px; align-items: center; }
input[type="color"] {
  -webkit-appearance: none; width: 28px; height: 28px;
  border: 1px solid var(--border); border-radius: 7px;
  cursor: pointer; padding: 0; background: transparent;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
input[type="color"]::-webkit-color-swatch { border-radius: 5px; border: none; }

/* Ratio presets */
.ratio-presets { display: flex; gap: 4px; flex-wrap: wrap; }
.ratio-preset {
  padding: 4px 8px; border-radius: 5px; font-size: 11px;
  border: 0.5px solid var(--border); cursor: pointer;
  background: var(--bg-elevated); color: var(--text-secondary);
  transition: var(--transition); font-weight: 500;
}
.ratio-preset:hover { border-color: var(--accent); color: var(--text); }
.ratio-preset.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 10px 20px; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Mobile */
@media (max-width: 900px) {
  main { flex-direction: column; height: auto; overflow: visible; }
  .panel-left { width: 100%; flex-shrink: 0; border-right: none; border-bottom: 0.5px solid var(--border); }
  .panel-right { width: 100%; flex-shrink: 0; border-left: none; border-top: 0.5px solid var(--border); }
  .panel-center { min-height: 50vh; padding: 16px; }
  .photo-list { max-height: 140px; flex-direction: row; flex-wrap: wrap; padding: 8px; gap: 4px; }
  .photo-item { flex-direction: column; padding: 4px; gap: 2px; min-width: 60px; }
  .photo-item .thumb { width: 48px; height: 48px; }
  .photo-item .info .name { font-size: 10px; max-width: 54px; }
  .photo-item .info .meta { display: none; }
  .photo-item .remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; }
  .panel-section { padding: 12px; }
  .template-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 480px) {
  header { padding: 0 12px; }
  .btn { padding: 6px 10px; font-size: 12px; }
  .panel-center { padding: 12px; }
  .template-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body data-theme="light">

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    拼图工具
  </div>
  <div class="actions">
    <button class="btn btn-icon" onclick="toggleTheme()" title="切换主题">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="btn btn-primary" onclick="exportCollage()">导出 PNG</button>
  </div>
</header>

<main>
  <!-- Left Panel: Upload & Photos -->
  <aside class="panel-left">
    <div class="panel-section">
      <h3>上传照片</h3>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><rect x="3" y="14" width="18" height="7" rx="1"/></svg>
        <p>拖拽或点击上传</p>
        <span>JPG / PNG / WebP</span>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
    </div>
    <div class="photo-count" id="photoCount">尚未上传照片</div>
    <div class="photo-list" id="photoList"></div>
  </aside>

  <!-- Center: Preview -->
  <section class="panel-center" id="previewArea">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <p>上传照片开始拼图</p>
    </div>
    <div class="preview-wrapper" id="previewWrapper" style="display:none">
      <div class="preview-grid" id="previewGrid"></div>
    </div>
  </section>

  <!-- Right Panel: Templates & Settings -->
  <aside class="panel-right">
    <div class="panel-section">
      <h3>拼图模板</h3>
      <div class="template-grid" id="templateGrid"></div>
    </div>
    <div class="panel-section" style="overflow-y:auto;flex:1">
      <h3>调整</h3>
      <div class="control-group">
        <label>比例</label>
        <div class="ratio-presets" id="ratioPresets"></div>
      </div>
      <div class="control-group">
        <label>间距 <span class="val" id="gapVal">4px</span></label>
        <input type="range" id="gapSlider" min="0" max="32" value="4" oninput="updateGap(this.value)">
      </div>
      <div class="control-group">
        <label>边框 <span class="val" id="borderVal">0px</span></label>
        <input type="range" id="borderSlider" min="0" max="20" value="0" oninput="updateBorder(this.value)">
      </div>
      <div class="control-group">
        <label>圆角 <span class="val" id="radiusVal">2px</span></label>
        <input type="range" id="radiusSlider" min="0" max="32" value="2" oninput="updateRadius(this.value)">
      </div>
      <div class="control-group">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#ffffff" onchange="updateBgColor(this.value)">
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
// ─── Templates ──────────────────────────────
// Each template: { id, name, cols, rows, cells: [{r,c,rs,cs}] }
// r/c 1-indexed, rs/cs = rowSpan/colSpan
const ALL_TEMPLATES = {
  2: [
    { id:'2-h',    name:'左右',  cols:2,rows:1, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1}] },
    { id:'2-v',    name:'上下',  cols:1,rows:2, cells:[{r:1,c:1,rs:1,cs:1},{r:2,c:1,rs:1,cs:1}] },
    { id:'2-big-l',name:'左大右小',cols:3,rows:2, cells:[{r:1,c:1,rs:2,cs:2},{r:1,c:3,rs:1,cs:1}] },
    { id:'2-big-t',name:'上大下小',cols:2,rows:3, cells:[{r:1,c:1,rs:2,cs:2},{r:3,c:1,rs:1,cs:2}] },
  ],
  3: [
    { id:'3-h',    name:'横排',  cols:3,rows:1, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:1,c:3,rs:1,cs:1}] },
    { id:'3-v',    name:'竖排',  cols:1,rows:3, cells:[{r:1,c:1,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:3,c:1,rs:1,cs:1}] },
    { id:'3-1t2b', name:'一大两小',cols:2,rows:2, cells:[{r:1,c:1,rs:1,cs:2},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1}] },
    { id:'3-tri',  name:'品字形',cols:2,rows:2, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:2,c:1,rs:1,cs:2}] },
  ],
  4: [
    { id:'4-2x2',  name:'2×2',   cols:2,rows:2, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1}] },
    { id:'4-h',    name:'横排',  cols:4,rows:1, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:1,c:3,rs:1,cs:1},{r:1,c:4,rs:1,cs:1}] },
    { id:'4-v',    name:'竖排',  cols:1,rows:4, cells:[{r:1,c:1,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:3,c:1,rs:1,cs:1},{r:4,c:1,rs:1,cs:1}] },
    { id:'4-1big', name:'一大三小',cols:3,rows:3, cells:[{r:1,c:1,rs:2,cs:2},{r:1,c:3,rs:1,cs:1},{r:2,c:3,rs:1,cs:1},{r:3,c:1,rs:1,cs:3}] },
  ],
  5: [
    { id:'5-cross',name:'十字',  cols:3,rows:3, cells:[{r:1,c:2,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:2,c:3,rs:1,cs:1},{r:3,c:2,rs:1,cs:1}] },
    { id:'5-2t3b', name:'上二下三',cols:6,rows:2, cells:[{r:1,c:1,rs:1,cs:3},{r:1,c:4,rs:1,cs:3},{r:2,c:1,rs:1,cs:2},{r:2,c:3,rs:1,cs:2},{r:2,c:5,rs:1,cs:2}] },
    { id:'5-2l3r', name:'左二右三',cols:2,rows:6, cells:[{r:1,c:1,rs:3,cs:1},{r:4,c:1,rs:3,cs:1},{r:1,c:2,rs:2,cs:1},{r:3,c:2,rs:2,cs:1},{r:5,c:2,rs:2,cs:1}] },
  ],
  6: [
    { id:'6-2x3',  name:'2×3',   cols:3,rows:2, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:1,c:3,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:2,c:3,rs:1,cs:1}] },
    { id:'6-3x2',  name:'3×2',   cols:2,rows:3, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:3,c:1,rs:1,cs:1},{r:3,c:2,rs:1,cs:1}] },
    { id:'6-1t5b', name:'一上五下',cols:3,rows:3, cells:[{r:1,c:1,rs:1,cs:3},{r:2,c:1,rs:2,cs:1},{r:2,c:2,rs:2,cs:1},{r:2,c:3,rs:1,cs:1},{r:3,c:3,rs:1,cs:1}] },
  ],
  7: [
    { id:'7-1t6b', name:'一大六下',cols:3,rows:3, cells:[{r:1,c:1,rs:1,cs:3},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:2,c:3,rs:1,cs:1},{r:3,c:1,rs:1,cs:1},{r:3,c:2,rs:1,cs:1},{r:3,c:3,rs:1,cs:1}] },
    { id:'7-cross',name:'七巧',cols:4,rows:4, cells:[{r:1,c:1,rs:2,cs:2},{r:1,c:3,rs:1,cs:1},{r:1,c:4,rs:1,cs:1},{r:2,c:3,rs:1,cs:1},{r:2,c:4,rs:1,cs:1},{r:3,c:1,rs:2,cs:2},{r:3,c:3,rs:2,cs:2}] },
  ],
  8: [
    { id:'8-2x4',  name:'2×4',   cols:4,rows:2, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:1,c:3,rs:1,cs:1},{r:1,c:4,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:2,c:3,rs:1,cs:1},{r:2,c:4,rs:1,cs:1}] },
    { id:'8-4x2',  name:'4×2',   cols:2,rows:4, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:3,c:1,rs:1,cs:1},{r:3,c:2,rs:1,cs:1},{r:4,c:1,rs:1,cs:1},{r:4,c:2,rs:1,cs:1}] },
    { id:'8-3t5b', name:'三上五下',cols:3,rows:3, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:1,c:3,rs:1,cs:1},{r:2,c:1,rs:2,cs:1},{r:2,c:2,rs:2,cs:1},{r:2,c:3,rs:1,cs:1},{r:3,c:3,rs:1,cs:1}] },
  ],
  9: [
    { id:'9-3x3',  name:'3×3',   cols:3,rows:3, cells:[{r:1,c:1,rs:1,cs:1},{r:1,c:2,rs:1,cs:1},{r:1,c:3,rs:1,cs:1},{r:2,c:1,rs:1,cs:1},{r:2,c:2,rs:1,cs:1},{r:2,c:3,rs:1,cs:1},{r:3,c:1,rs:1,cs:1},{r:3,c:2,rs:1,cs:1},{r:3,c:3,rs:1,cs:1}] },
    { id:'9-1t8b', name:'一大八下',cols:3,rows:3, cells:[{r:1,c:1,rs:1,cs:3},{r:2,c:1,rs:2,cs:1},{r:2,c:2,rs:2,cs:1},{r:2,c:3,rs:2,cs:1}] },
  ],
  10: [
    { id:'10-2x5', name:'2×5', cols:5,rows:2, cells:Array.from({length:10},(_,i)=>({r:Math.floor(i/5)+1,c:i%5+1,rs:1,cs:1})) },
  ],
};

// ─── State ─────────────────────────────────
let photos = []; // { id, file, url }
let activeTemplate = null;
let settings = {
  ratio: '1:1',
  gap: 4,
  border: 0,
  radius: 2,
  bgColor: '#ffffff',
};
let dragIdx = -1;

// ─── Init ──────────────────────────────────
const ratios = [
  { label:'1:1', w:1, h:1 },
  { label:'4:3', w:4, h:3 },
  { label:'3:4', w:3, h:4 },
  { label:'3:2', w:3, h:2 },
  { label:'2:3', w:2, h:3 },
  { label:'16:9', w:16, h:9 },
  { label:'9:16', w:9, h:16 },
];

function initRatioPresets() {
  const el = document.getElementById('ratioPresets');
  ratios.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'ratio-preset' + (r.label === settings.ratio ? ' active' : '');
    btn.textContent = r.label;
    btn.onclick = () => { settings.ratio = r.label; renderRatioPresets(); renderTemplateList(); renderPreview(); };
    el.appendChild(btn);
  });
}

function renderRatioPresets() {
  document.querySelectorAll('.ratio-preset').forEach(b => {
    b.classList.toggle('active', b.textContent === settings.ratio);
  });
}

function renderTemplateList() {
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = '';
  const count = photos.length;
  if (count < 2) {
    grid.innerHTML = '<p style="font-size:11px;color:var(--text-tertiary);text-align:center;grid-column:1/-1;padding:16px;">至少需要 2 张照片</p>';
    return;
  }
  // Get templates that match photo count exactly
  const key = Math.min(count, 10);
  const templates = ALL_TEMPLATES[key] || [];
  if (templates.length === 0) {
    grid.innerHTML = '<p style="font-size:11px;color:var(--text-tertiary);text-align:center;grid-column:1/-1;padding:16px;">当前照片数量无匹配模板</p>';
    return;
  }
  templates.forEach(t => {
    const card = document.createElement('div');
    card.className = 'template-card' + (activeTemplate && activeTemplate.id === t.id ? ' active' : '');
    // Mini preview
    const mini = document.createElement('div');
    mini.className = 'preview-mini';
    mini.style.gridTemplateColumns = `repeat(${t.cols}, 1fr)`;
    mini.style.gridTemplateRows = `repeat(${t.rows}, 1fr)`;
    t.cells.forEach(cell => {
      const d = document.createElement('div');
      d.style.gridRow = `${cell.r} / span ${cell.rs}`;
      d.style.gridColumn = `${cell.c} / span ${cell.cs}`;
      mini.appendChild(d);
    });
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = t.name;
    card.appendChild(mini);
    card.appendChild(label);
    card.onclick = () => selectTemplate(t);
    grid.appendChild(card);
  });
}

function selectTemplate(t) {
  activeTemplate = t;
  renderTemplateList();
  renderPreview();
}

function handleFiles(files) {
  if (!files || files.length === 0) return;
  Array.from(files).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    photos.push({ id: Date.now() + Math.random(), file: f, url: URL.createObjectURL(f) });
  });
  // Auto-select first template matching count
  const key = Math.min(photos.length, 10);
  const temps = ALL_TEMPLATES[key];
  if (temps && temps.length > 0 && (!activeTemplate || activeTemplate.cells.length !== photos.length)) {
    activeTemplate = temps[0];
  }
  renderPhotoList();
  renderTemplateList();
  renderPreview();
  document.getElementById('fileInput').value = '';
}

function renderPhotoList() {
  const list = document.getElementById('photoList');
  const countEl = document.getElementById('photoCount');
  list.innerHTML = '';
  if (photos.length === 0) {
    countEl.textContent = '尚未上传照片';
    return;
  }
  countEl.textContent = `共 ${photos.length} 张照片`;
  photos.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.draggable = true;
    item.dataset.idx = i;
    item.innerHTML = `
      <img class="thumb" src="${p.url}" alt="">
      <div class="info">
        <div class="name">${p.file.name}</div>
        <div class="meta">${(p.file.size/1024).toFixed(0)}KB</div>
      </div>
      <button class="remove" onclick="event.stopPropagation(); removePhoto(${i})">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    item.addEventListener('dragstart', e => { dragIdx = i; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); dragIdx = -1; });
    item.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    item.addEventListener('drop', e => {
      e.preventDefault();
      const from = parseInt(item.dataset.idx);
      if (dragIdx >= 0 && dragIdx !== from) {
        const [moved] = photos.splice(dragIdx, 1);
        photos.splice(from, 0, moved);
        renderPhotoList();
        renderPreview();
      }
    });
    list.appendChild(item);
  });
}

function removePhoto(i) {
  const p = photos[i];
  if (p.url) URL.revokeObjectURL(p.url);
  photos.splice(i, 1);
  // Re-check template
  const key = Math.min(photos.length, 10);
  if (photos.length < 2) activeTemplate = null;
  else {
    const temps = ALL_TEMPLATES[key];
    if (temps && temps.length > 0 && (!activeTemplate || activeTemplate.cells.length !== photos.length)) {
      activeTemplate = temps[0];
    }
  }
  renderPhotoList();
  renderTemplateList();
  renderPreview();
}

function renderPreview() {
  const wrapper = document.getElementById('previewWrapper');
  const grid = document.getElementById('previewGrid');
  const empty = document.getElementById('emptyState');

  if (photos.length < 2 || !activeTemplate) {
    wrapper.style.display = 'none';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  wrapper.style.display = '';

  const { cols, rows, cells } = activeTemplate;
  const ratio = ratios.find(r => r.label === settings.ratio) || ratios[0];
  const aspectW = ratio.w, aspectH = ratio.h;

  // Calculate preview size fitting in panel-center
  const center = document.getElementById('previewArea');
  const maxW = center.clientWidth - 64;
  const maxH = center.clientHeight - 64;
  let pw, ph;
  if (maxW / maxH > aspectW / aspectH) {
    ph = maxH; pw = ph * aspectW / aspectH;
  } else {
    pw = maxW; ph = pw * aspectH / aspectW;
  }
  wrapper.style.width = pw + 'px';
  wrapper.style.height = ph + 'px';

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  grid.style.gap = settings.gap + 'px';
  grid.style.padding = settings.gap + 'px';
  grid.style.backgroundColor = settings.bgColor;
  grid.style.borderRadius = settings.radius + 'px';

  grid.innerHTML = '';
  cells.forEach((cell, i) => {
    const div = document.createElement('div');
    div.className = 'cell';
    div.style.gridRow = `${cell.r} / span ${cell.rs}`;
    div.style.gridColumn = `${cell.c} / span ${cell.cs}`;
    div.style.borderRadius = settings.radius > 2 ? (settings.radius - 2) + 'px' : '0px';
    div.style.outline = settings.border > 0 ? `${settings.border}px solid ${settings.bgColor}` : 'none';
    if (i < photos.length) {
      const img = document.createElement('img');
      img.src = photos[i].url;
      div.appendChild(img);
    } else {
      div.classList.add('empty');
      div.textContent = '空';
    }
    grid.appendChild(div);
  });
}

function updateGap(v) { settings.gap = parseInt(v); document.getElementById('gapVal').textContent = v + 'px'; renderPreview(); }
function updateBorder(v) { settings.border = parseInt(v); document.getElementById('borderVal').textContent = v + 'px'; renderPreview(); }
function updateRadius(v) { settings.radius = parseInt(v); document.getElementById('radiusVal').textContent = v + 'px'; renderPreview(); }
function updateBgColor(v) { settings.bgColor = v; renderPreview(); }

// ─── Export ────────────────────────────────
async function exportCollage() {
  if (photos.length < 2 || !activeTemplate) {
    showToast('请先上传照片并选择模板');
    return;
  }
  showToast('正在生成…');

  const t = activeTemplate;
  const ratio = ratios.find(r => r.label === settings.ratio) || ratios[0];
  // Use a target width for export
  const baseW = 2400;
  const baseH = Math.round(baseW * ratio.h / ratio.w);
  const gap = Math.round(settings.gap * baseW / 800);
  const border = Math.round(settings.border * baseW / 800);

  const canvas = document.createElement('canvas');
  canvas.width = baseW;
  canvas.height = baseH;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = settings.bgColor;
  ctx.beginPath();
  if (settings.radius > 0) {
    const r = settings.radius * baseW / 800;
    roundRect(ctx, 0, 0, baseW, baseH, r);
    ctx.fill();
    ctx.save();
    ctx.clip();
  } else {
    ctx.fillRect(0, 0, baseW, baseH);
  }

  const innerW = baseW - gap * 2;
  const innerH = baseH - gap * 2;
  const cellW = innerW / t.cols;
  const cellH = innerH / t.rows;

  // Load all images
  const imgs = await Promise.all(photos.map(p => loadImage(p.url)));

  for (let i = 0; i < t.cells.length; i++) {
    if (i >= imgs.length) continue;
    const cell = t.cells[i];
    const x = gap + (cell.c - 1) * cellW;
    const y = gap + (cell.r - 1) * cellH;
    const w = cell.cs * cellW;
    const h = cell.rs * cellH;

    // Draw border (as gap between cells in the main background color)
    if (border > 0) {
      ctx.fillStyle = settings.bgColor;
      ctx.fillRect(x - border, y - border, w + border * 2, h + border * 2);
    }

    // Draw image with cover fit
    const img = imgs[i];
    const scale = Math.max(w / img.width, h / img.height);
    const sw = img.width * scale;
    const sh = img.height * scale;
    const sx = (sw - w) / 2;
    const sy = (sh - h) / 2;

    ctx.save();
    ctx.beginPath();
    const cr = Math.max(0, settings.radius * baseW / 800 - gap);
    if (cr > 1) roundRect(ctx, x, y, w, h, cr);
    else ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.drawImage(img, x - sx, y - sy, sw, sh);
    ctx.restore();
  }

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `collage_${Date.now()}.png`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出完成');
  }, 'image/png');
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ─── Drag & Drop Upload ────────────────────
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

// ─── Paste upload ──────────────────────────
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.type.startsWith('image/')) files.push(item.getAsFile());
  }
  if (files.length > 0) handleFiles(files);
});

// ─── Theme ─────────────────────────────────
function toggleTheme() {
  const body = document.body;
  const current = body.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  body.setAttribute('data-theme', next);
  const bgInput = document.getElementById('bgColor');
  bgInput.value = next === 'dark' ? '#1a1a1a' : '#ffffff';
  settings.bgColor = bgInput.value;
  renderPreview();
}

// ─── Toast ─────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── Resize ────────────────────────────────
window.addEventListener('resize', renderPreview);

// ─── Init ──────────────────────────────────
initRatioPresets();
renderTemplateList();
</script>
