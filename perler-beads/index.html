<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆游戏</title>
<style>
:root{
  --bg:#f5f5f5;--panel-bg:#fff;--border:#e0e0e0;--text:#333;
  --text2:#999;--accent:#444;--radius:5px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);height:100vh;display:flex;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}

/* 左侧色板 */
.sidebar{
  width:220px;min-width:220px;background:var(--panel-bg);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding:12px;gap:8px;overflow-y:auto;
}
.sidebar h2{font-size:13px;font-weight:600;}
.tool-row{display:flex;gap:4px;flex-wrap:wrap}
.btn{
  padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--panel-bg);font-size:11px;cursor:pointer;transition:all .1s;
  white-space:nowrap;
}
.btn:hover{background:#f0f0f0}
.btn.ac{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.warn{background:#e74c3c;color:#fff;border-color:#e74c3c}
.btn.warn:hover{background:#c0392b}
.btn-sm{padding:3px 7px;font-size:10px}

.color-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
}
.color-swatch{
  aspect-ratio:1;border-radius:3px;border:1px solid var(--border);
  cursor:pointer;position:relative;transition:transform .08s;
}
.color-swatch:hover{transform:scale(1.12);z-index:2}
.color-swatch.selected{outline:2px solid var(--accent);outline-offset:1px}
.color-swatch.eraser{background: repeating-linear-gradient(45deg,#ddd 0px,#ddd 4px,#fff 4px,#fff 8px)}

/* 主区域 */
.main{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.toolbar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--panel-bg);border-bottom:1px solid var(--border);
  flex-wrap:wrap;min-height:40px;
}
.toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.toolbar label{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:3px}
.toolbar select,.toolbar input[type=range]{
  font-size:11px;border:1px solid var(--border);border-radius:3px;padding:2px 4px;
  background:var(--panel-bg);
}
.toolbar input[type=range]{width:80px}
.toolbar .val{font-size:10px;color:var(--text2);min-width:24px;text-align:center}
.toolbar input[type=file]{display:none}

.canvas-wrap{
  flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
  padding:16px;min-height:0;
}
.canvas-wrap canvas{cursor:crosshair;border:1px solid var(--border);border-radius:2px}

/* 底部状态 */
.status{
  padding:6px 12px;background:var(--panel-bg);border-top:1px solid var(--border);
  font-size:11px;color:var(--text2);display:flex;gap:16px;flex-wrap:wrap;
}

/* Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:6px 16px;border-radius:20px;
  font-size:12px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}

/* 打印 */
@media print{
  body{display:block;overflow:visible}
  .sidebar,.toolbar,.status{display:none}
  .main{padding:0}
  .canvas-wrap canvas{border:none;max-width:100%}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <h2>工具</h2>
  <div class="tool-row">
    <button class="btn ac selected" id="toolPlace">放置</button>
    <button class="btn" id="toolErase">橡皮</button>
    <button class="btn" id="toolPicker">吸色</button>
  </div>

  <h2>色板</h2>
  <div class="color-grid" id="colorGrid"></div>

  <h2>参考图</h2>
  <button class="btn btn-sm" id="btnRefImg">选择参考图</button>
  <input type="file" id="refFileInput" accept="image/*" style="display:none">
  <label style="font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-top:2px">
    <input type="range" id="refOpacity" min="5" max="100" value="35" style="width:100px"> 透明度 <span id="refOpacityVal">35</span>%
  </label>
  <button class="btn btn-sm" id="btnClearRef" style="display:none">清除参考图</button>
</div>

<div class="main">
  <div class="toolbar">
    <label>画布 <select id="canvasWidth">
      <option value="10">10×10</option><option value="15">15×15</option>
      <option value="20">20×20</option><option value="29" selected>29×29</option>
      <option value="40">40×40</option><option value="50">50×50</option>
    </select></label>
    <label>缩放 <input type="range" id="zoom" min="4" max="32" value="18"> <span class="val" id="zoomVal">18</span>px</label>
    <span class="sep"></span>
    <button class="btn btn-sm" id="btnUndo">撤销</button>
    <button class="btn btn-sm" id="btnRedo">重做</button>
    <button class="btn btn-sm" id="btnClear">清空</button>
    <span class="sep"></span>
    <button class="btn btn-sm ac" id="btnExport">导出PNG</button>
    <button class="btn btn-sm" id="btnPrint">打印</button>
    <button class="btn btn-sm" id="btnSave">保存方案</button>
    <button class="btn btn-sm" id="btnLoad">加载方案</button>
    <input type="file" id="loadFileInput" accept=".json" style="display:none">
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="beadCanvas"></canvas>
  </div>
  <div class="status" id="statusBar">
    <span>画布: 29×29 (841颗)</span>
    <span id="usedCount">已放置: 0颗</span>
    <span id="colorCount">颜色: 0种</span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ====== 拼豆色板 ======
const PALETTE = [
  {id:'01',name:'黑',hex:'#1a1a1a'},{id:'02',name:'深灰',hex:'#555'},
  {id:'03',name:'灰',hex:'#888'},{id:'04',name:'浅灰',hex:'#b0b0b0'},
  {id:'05',name:'白',hex:'#f5f0eb'},
  {id:'06',name:'深红',hex:'#8b0000'},{id:'07',name:'红',hex:'#dc143c'},
  {id:'08',name:'亮红',hex:'#ff3b3b'},{id:'09',name:'玫红',hex:'#e91e63'},
  {id:'10',name:'粉',hex:'#ff69b4'},{id:'11',name:'浅粉',hex:'#ffb6c1'},
  {id:'12',name:'肉色',hex:'#ffdab9'},{id:'13',name:'深橙',hex:'#e65100'},
  {id:'14',name:'橙',hex:'#ff9800'},{id:'15',name:'杏色',hex:'#ffcc80'},
  {id:'16',name:'金黄',hex:'#ffc107'},{id:'17',name:'黄',hex:'#ffeb3b'},
  {id:'18',name:'浅黄',hex:'#fff9c4'},{id:'19',name:'深绿',hex:'#1b5e20'},
  {id:'20',name:'绿',hex:'#4caf50'},{id:'21',name:'亮绿',hex:'#8bc34a'},
  {id:'22',name:'草绿',hex:'#cddc39'},{id:'23',name:'薄荷绿',hex:'#a5d6a7'},
  {id:'24',name:'淡绿',hex:'#c8e6c9'},{id:'25',name:'深青',hex:'#006064'},
  {id:'26',name:'青',hex:'#00bcd4'},{id:'27',name:'浅青',hex:'#80deea'},
  {id:'28',name:'深蓝',hex:'#0d47a1'},{id:'29',name:'蓝',hex:'#2196f3'},
  {id:'30',name:'亮蓝',hex:'#42a5f5'},{id:'31',name:'浅蓝',hex:'#90caf9'},
  {id:'32',name:'天蓝',hex:'#bbdefb'},{id:'33',name:'深紫',hex:'#4a148c'},
  {id:'34',name:'紫',hex:'#9c27b0'},{id:'35',name:'亮紫',hex:'#ba68c8'},
  {id:'36',name:'淡紫',hex:'#e1bee7'},{id:'37',name:'深棕',hex:'#3e2723'},
  {id:'38',name:'棕',hex:'#795548'},{id:'39',name:'浅棕',hex:'#a1887f'},
  {id:'40',name:'米色',hex:'#d7ccc8'},{id:'41',name:'沙色',hex:'#f5deb3'},
  {id:'42',name:'奶油',hex:'#fffde7'},{id:'43',name:'薰衣草',hex:'#d1c4e9'},
  {id:'44',name:'透明',hex:'#e8e8e8'},
];

// ====== 状态 ======
let gridW = 29, gridH = 29;
let cellSize = 18;
let colors = [];           // 扁平数组，gridH*gridW，-1=空
let selectedColor = 0;     // 当前选中的色板索引
let tool = 'place';        // 'place' | 'erase' | 'picker'
let undoStack = [], redoStack = [];
let isDrawing = false;
let lastCell = null;       // 拖拽时上一个绘制的格子
let refImage = null;       // 参考图 Image 对象
let refOpacity = 0.35;

const canvas = document.getElementById('beadCanvas');
const ctx = canvas.getContext('2d');

// ====== 初始化 ======
function initGrid(w, h) {
  gridW = w; gridH = h;
  colors = new Array(w * h).fill(-1);
  undoStack = []; redoStack = [];
  canvas.width = w * cellSize;
  canvas.height = h * cellSize;
  updateStatus();
  render();
}

function setCell(row, col, colorIdx, pushUndo = true) {
  if (row < 0 || row >= gridH || col < 0 || col >= gridW) return;
  const i = row * gridW + col;
  if (colors[i] === colorIdx) return;
  if (pushUndo) {
    undoStack.push({ i, prev: colors[i], next: colorIdx });
    redoStack = [];
  }
  colors[i] = colorIdx;
  renderCell(row, col);
  updateStatus();
}

// ====== 渲染 ======
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 参考图
  if (refImage) {
    ctx.globalAlpha = refOpacity;
    ctx.drawImage(refImage, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
  }
  // 网格背景
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      renderCellRaw(r, c);
    }
  }
  // 网格线
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 0.5;
  for (let c = 1; c < gridW; c++) {
    ctx.beginPath(); ctx.moveTo(c*cellSize, 0); ctx.lineTo(c*cellSize, canvas.height); ctx.stroke();
  }
  for (let r = 1; r < gridH; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*cellSize); ctx.lineTo(canvas.width, r*cellSize); ctx.stroke();
  }
  // 参考图叠加
  if (refImage) {
    ctx.globalAlpha = refOpacity;
    ctx.drawImage(refImage, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
  }
}

function renderCell(row, col) {
  const x = col * cellSize, y = row * cellSize;
  // 先清除该格（含参考图）
  ctx.clearRect(x, y, cellSize, cellSize);
  // 恢复参考图
  if (refImage) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, cellSize, cellSize); ctx.clip();
    ctx.globalAlpha = refOpacity;
    ctx.drawImage(refImage, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  // 填充背景
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(x, y, cellSize, cellSize);
  renderCellRaw(row, col);
  // 网格线
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x + 0.25, y + 0.25, cellSize - 0.5, cellSize - 0.5);
}

function renderCellRaw(row, col) {
  const idx = colors[row * gridW + col];
  if (idx < 0) return;
  const c = PALETTE[idx];
  const x = col * cellSize, y = row * cellSize;
  const cx = x + cellSize / 2, cy = y + cellSize / 2;
  const r = cellSize * 0.44;
  const grad = ctx.createRadialGradient(cx - r*0.25, cy - r*0.3, r*0.05, cx, cy, r);
  const hex = c.hex;
  const rr = parseInt(hex.slice(1,3),16), gg = parseInt(hex.slice(3,5),16), bb = parseInt(hex.slice(5,7),16);
  const bright = `rgb(${Math.min(255,rr+55)},${Math.min(255,gg+55)},${Math.min(255,bb+55)})`;
  const dark = `rgb(${Math.max(0,rr-40)},${Math.max(0,gg-40)},${Math.max(0,bb-40)})`;
  grad.addColorStop(0, bright);
  grad.addColorStop(0.65, c.hex);
  grad.addColorStop(1, dark);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();
}

// ====== 鼠标交互 ======
canvas.addEventListener('mousedown', (e) => {
  const cell = cellFromEvent(e);
  if (!cell) return;
  isDrawing = true;
  lastCell = cell;
  handleCell(cell.row, cell.col);
});
canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  const cell = cellFromEvent(e);
  if (!cell) return;
  if (lastCell && lastCell.row === cell.row && lastCell.col === cell.col) return;
  lastCell = cell;
  handleCell(cell.row, cell.col);
});
canvas.addEventListener('mouseup', () => { isDrawing = false; lastCell = null; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; lastCell = null; });

// 触摸支持
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const cell = cellFromEvent(e.touches[0]);
  if (!cell) return;
  isDrawing = true; lastCell = cell;
  handleCell(cell.row, cell.col);
}, {passive:false});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!isDrawing) return;
  const cell = cellFromEvent(e.touches[0]);
  if (!cell) return;
  if (lastCell && lastCell.row===cell.row && lastCell.col===cell.col) return;
  lastCell = cell;
  handleCell(cell.row, cell.col);
}, {passive:false});
canvas.addEventListener('touchend', () => { isDrawing = false; lastCell = null; });

function cellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const col = Math.floor(x / cellSize);
  const row = Math.floor(y / cellSize);
  if (col < 0 || col >= gridW || row < 0 || row >= gridH) return null;
  return { row, col };
}

function handleCell(row, col) {
  if (tool === 'place') {
    setCell(row, col, selectedColor);
  } else if (tool === 'erase') {
    setCell(row, col, -1);
  } else if (tool === 'picker') {
    const idx = colors[row * gridW + col];
    if (idx >= 0) {
      selectedColor = idx;
      updateSwatchSelection();
      showToast('已选取: ' + PALETTE[idx].name);
    }
  }
}

// ====== 撤销/重做 ======
document.getElementById('btnUndo').addEventListener('click', () => {
  if (undoStack.length === 0) return;
  const act = undoStack.pop();
  redoStack.push({ i: act.i, prev: colors[act.i], next: act.prev });
  colors[act.i] = act.prev;
  const row = Math.floor(act.i / gridW), col = act.i % gridW;
  renderCell(row, col);
  updateStatus();
});
document.getElementById('btnRedo').addEventListener('click', () => {
  if (redoStack.length === 0) return;
  const act = redoStack.pop();
  undoStack.push({ i: act.i, prev: colors[act.i], next: act.next });
  colors[act.i] = act.next;
  const row = Math.floor(act.i / gridW), col = act.i % gridW;
  renderCell(row, col);
  updateStatus();
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) document.getElementById('btnRedo').click();
    else document.getElementById('btnUndo').click();
  }
});

// ====== 工具切换 ======
function setTool(t) {
  tool = t;
  document.querySelectorAll('#toolPlace,#toolErase,#toolPicker').forEach(b => b.classList.remove('ac','selected'));
  const btn = document.getElementById(t === 'place' ? 'toolPlace' : t === 'erase' ? 'toolErase' : 'toolPicker');
  btn.classList.add('ac','selected');
  canvas.style.cursor = t === 'picker' ? 'crosshair' : 'crosshair';
}

document.getElementById('toolPlace').addEventListener('click', () => setTool('place'));
document.getElementById('toolErase').addEventListener('click', () => setTool('erase'));
document.getElementById('toolPicker').addEventListener('click', () => setTool('picker'));

// ====== 色板 ======
function buildColorGrid() {
  const grid = document.getElementById('colorGrid');
  grid.innerHTML = '';
  PALETTE.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === selectedColor ? ' selected' : '');
    sw.style.background = c.hex;
    sw.title = `${c.id} ${c.name}`;
    sw.addEventListener('click', () => {
      selectedColor = i;
      tool = 'place';
      setTool('place');
      updateSwatchSelection();
    });
    grid.appendChild(sw);
  });
}

function updateSwatchSelection() {
  document.querySelectorAll('.color-swatch').forEach((el, i) => {
    el.classList.toggle('selected', i === selectedColor);
  });
}

buildColorGrid();

// ====== 工具栏 ======
document.getElementById('canvasWidth').addEventListener('change', function() {
  const v = parseInt(this.value);
  initGrid(v, v);
});
document.getElementById('zoom').addEventListener('input', function() {
  cellSize = parseInt(this.value);
  document.getElementById('zoomVal').textContent = cellSize;
  canvas.width = gridW * cellSize;
  canvas.height = gridH * cellSize;
  render();
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (colors.every(c => c === -1)) return;
  for (let i = 0; i < colors.length; i++) {
    if (colors[i] !== -1) undoStack.push({ i, prev: colors[i], next: -1 });
  }
  redoStack = [];
  colors.fill(-1);
  render();
  updateStatus();
  showToast('已清空');
});

// ====== 导出 ======
document.getElementById('btnExport').addEventListener('click', () => {
  const expCanvas = document.createElement('canvas');
  expCanvas.width = gridW * cellSize;
  expCanvas.height = gridH * cellSize;
  const expCtx = expCanvas.getContext('2d');
  // 白底
  expCtx.fillStyle = '#fff';
  expCtx.fillRect(0, 0, expCanvas.width, expCanvas.height);
  // 画珠子
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      const idx = colors[r * gridW + c];
      if (idx < 0) continue;
      const clr = PALETTE[idx];
      const x = c * cellSize, y = r * cellSize;
      const cx = x + cellSize/2, cy = y + cellSize/2;
      const rad = cellSize * 0.44;
      const grad = expCtx.createRadialGradient(cx-rad*0.25, cy-rad*0.3, rad*0.05, cx, cy, rad);
      const hex = clr.hex;
      const rr = parseInt(hex.slice(1,3),16), gg = parseInt(hex.slice(3,5),16), bb = parseInt(hex.slice(5,7),16);
      grad.addColorStop(0, `rgb(${Math.min(255,rr+55)},${Math.min(255,gg+55)},${Math.min(255,bb+55)})`);
      grad.addColorStop(0.65, clr.hex);
      grad.addColorStop(1, `rgb(${Math.max(0,rr-40)},${Math.max(0,gg-40)},${Math.max(0,bb-40)})`);
      expCtx.fillStyle = grad;
      expCtx.beginPath();
      expCtx.arc(cx, cy, rad, 0, Math.PI*2);
      expCtx.fill();
    }
  }
  // 网格线
  expCtx.strokeStyle = 'rgba(0,0,0,0.1)';
  expCtx.lineWidth = 0.5;
  for (let c = 1; c < gridW; c++) { expCtx.beginPath(); expCtx.moveTo(c*cellSize,0); expCtx.lineTo(c*cellSize,expCanvas.height); expCtx.stroke(); }
  for (let r = 1; r < gridH; r++) { expCtx.beginPath(); expCtx.moveTo(0,r*cellSize); expCtx.lineTo(expCanvas.width,r*cellSize); expCtx.stroke(); }
  const link = document.createElement('a');
  link.download = '拼豆作品.png';
  link.href = expCanvas.toDataURL('image/png');
  link.click();
  showToast('已导出');
});

document.getElementById('btnPrint').addEventListener('click', () => window.print());

// ====== 保存/加载本地存储 ======
document.getElementById('btnSave').addEventListener('click', () => {
  const data = { w: gridW, h: gridH, colors, timestamp: Date.now() };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const link = document.createElement('a');
  link.download = `拼豆方案_${new Date().toISOString().slice(0,10)}.json`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('已保存方案');
});

document.getElementById('btnLoad').addEventListener('click', () => {
  document.getElementById('loadFileInput').click();
});
document.getElementById('loadFileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.w || !data.h || !data.colors) throw new Error('格式错误');
      gridW = data.w; gridH = data.h;
      document.getElementById('canvasWidth').value = gridW;
      colors = data.colors.slice(0, gridW * gridH);
      while (colors.length < gridW * gridH) colors.push(-1);
      undoStack = []; redoStack = [];
      canvas.width = gridW * cellSize;
      canvas.height = gridH * cellSize;
      render();
      updateStatus();
      showToast('方案已加载');
    } catch {
      showToast('文件格式无效');
    }
  };
  reader.readAsText(file);
  this.value = '';
});

// ====== 参考图 ======
document.getElementById('btnRefImg').addEventListener('click', () => {
  document.getElementById('refFileInput').click();
});
document.getElementById('refFileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    refImage = img;
    document.getElementById('btnClearRef').style.display = '';
    render();
    showToast('参考图已加载');
  };
  img.src = url;
  this.value = '';
});
document.getElementById('refOpacity').addEventListener('input', function() {
  refOpacity = parseInt(this.value) / 100;
  document.getElementById('refOpacityVal').textContent = parseInt(this.value);
  render();
});
document.getElementById('btnClearRef').addEventListener('click', () => {
  refImage = null;
  document.getElementById('btnClearRef').style.display = 'none';
  render();
  showToast('参考图已清除');
});

// ====== 状态栏 ======
function updateStatus() {
  let used = 0;
  const colorSet = new Set();
  for (const c of colors) {
    if (c >= 0) { used++; colorSet.add(c); }
  }
  document.getElementById('usedCount').textContent = `已放置: ${used}颗`;
  document.getElementById('colorCount').textContent = `颜色: ${colorSet.size}种`;
  const info = `画布: ${gridW}×${gridH} (${gridW*gridH}颗)`;
  document.querySelector('.status span').textContent = info;
}

// ====== Toast ======
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1500);
}

// ====== 启动 ======
initGrid(29, 29);
setTool('place');
</script>
</body>
</html>
